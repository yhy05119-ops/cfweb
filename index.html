<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>灵感收集站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f0f11;
      --text: #e0e0e5;
      --text-dim: #a0a0b0;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.15);
      --card: rgba(20, 20, 25, 0.7);
      --border: rgba(255,255,255,0.08);
    }
    
    [data-theme="light"] {
      --bg: #f8f9fc;
      --text: #1a1a2e;
      --text-dim: #5a5a70;
      --accent: #0066ff;
      --accent-glow: rgba(0, 102, 255, 0.12);
      --card: rgba(255,255,255,0.65);
      --border: rgba(0,0,0,0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.6;
      transition: background 0.4s ease;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-dim);
      max-width: 460px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem 1.5rem;
      backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px var(--accent-glow);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, var(--accent-glow), transparent);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {
      font-size: 1.35rem;
      margin-bottom: 0.8rem;
      color: var(--accent);
    }

    .card p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }

    .card a {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }

    .card a:hover {
      text-decoration: underline;
      transform: translateX(6px);
      display: inline-flex;
      align-items: center;
    }

    .card a::after {
      content: '→';
      margin-left: 0.5rem;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.3s;
    }

    .card a:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    @media (max-width: 600px) {
      .container { grid-template-columns: 1fr; }
      header { margin-bottom: 2.5rem; }
    }
  </style>
  <script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer
></script>
</head>
<body>

  <button class="theme-toggle" title="切换深色/浅色模式">☀️</button>

  <header>
    <h1>美观导航</h1>
    <p class="subtitle">灵感站 · 工具箱</p>
  </header>

  <div class="container">

    <!-- 你可以继续在这里添加更多卡片 -->
    <div class="card">
      <h3>二维码</h3>
      <p>生成解析二维码</p>
      <a href="/QR" target="_blank">使用 →</a>
    </div>
    
      <div class="card">
      <h3>整数</h3>
      <p>二进制转整数</p>
      <a href="/bin2dec" target="_blank">使用 →</a>
    </div>

  </div>

  <script>
    const toggle = document.querySelector('.theme-toggle');
    const html = document.documentElement;

    // 读取本地偏好或系统偏好
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme) {
      html.setAttribute('data-theme', savedTheme);
      toggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    } else {
      const initialTheme = prefersDark ? 'dark' : 'light';
      html.setAttribute('data-theme', initialTheme);
      toggle.textContent = initialTheme === 'dark' ? '☀️' : '🌙';
    }

    toggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      toggle.textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', next);
    });
  </script>

</body>
</html>
