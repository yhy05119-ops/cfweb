<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>率土之滨-2D商业版内核</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none; /* 禁用iOS长按菜单 */
            -webkit-user-select: none;   /* 禁用iOS文字选中 */
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            position: relative;
        }
        /* 针对iOS刘海屏/灵动岛的安全区适配 */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* 禁用浏览器默认手势，交给Canvas处理 */
        }
        /* UI层：独立于Canvas，便于高效率排版 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 允许点击穿透到Canvas */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .hud-panel {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #c3a060;
            border-radius: 6px;
            padding: 8px 16px;
            color: #fff;
            display: flex;
            gap: 20px;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .res-item span { color: #c3a060; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="res-item">木材: <span id="wood">150K</span></div>
            <div class="res-item">铁矿: <span id="iron">180K</span></div>
            <div class="res-item">石料: <span id="stone">120K</span></div>
            <div class="res-item">粮草: <span id="food">200K</span></div>
        </div>
    </div>

<script>
/**
 * 率土之滨2D商业级单HTML内核
 * 适配iOS高性能渲染、大地图裁剪、九宫格拖拽
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // 关闭透明度通道提升iOS Canvas性能

// 游戏配置
const CONFIG = {
    MAP_WIDTH: 200,      // 大地图格子宽度 (200x200 = 4万块土地)
    MAP_HEIGHT: 200,
    TILE_SIZE: 128,      // 单个格子像素大小
    FPS: 60
};

// 游戏状态
const state = {
    camera: { x: 2000, y: 2000, zoom: 1.0 }, // 摄像机位置
    touch: { isDragging: false, lastX: 0, lastY: 0, startX: 0, startY: 0, moved: false },
    screen: { width: 0, height: 0, dpr: 1 },
    selectedTile: null
};

// 商业版本资源配置：Base64 占位图（真实开发中请替换为真实美术资源的Base64）
const ASSETS = {
    // 绿地（土地）
    grass: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD17NoVAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAAZQTFRFNDg4SkpKT09PAAAA7FInbAAAAAJ0Uk5T/wDltzBKAAAAPElEQVR42uzYQQ0AAAgDMOZf2hGGrwNKaNu9VwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAbgEGXgAB78gSTgAAAABJRU5ErkJggg==",
    // 玩家主城
    castle: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD17NoVAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAAZQTFRF///MmZmZAAAA9P78OAAAAAJ0Uk5T/wDltzBKAAAAUklEQVR42uzXMQ0AAAwDoM6/9To2vgoE6m4pAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgG8BBl4AAe/IEk4AAAAASUVORK5CYII="
};

const images = {};
let assetsLoaded = 0;
const totalAssets = Object.keys(ASSETS).length;

// 初始化资源
function loadAssets(callback) {
    for (let key in ASSETS) {
        images[key] = new Image();
        images[key] = new Image();
        images[key].onload = () => {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) callback();
        };
        images[key].src = ASSETS[key];
    }
}

// 模拟生成率土之滨大地图数据 (沙盘格子)
const worldMap = [];
function initMap() {
    for (let x = 0; x < CONFIG.MAP_WIDTH; x++) {
        worldMap[x] = [];
        for (let y = 0; y < CONFIG.MAP_HEIGHT; y++) {
            // 默认全是土地(grass)，随机刷一些高级资源地或玩家主城
            let type = 'grass';
            let level = Math.floor(Math.random() * 9) + 1; // 1-9级地
            if (x === 18 && y === 18) {
                type = 'castle'; // 模拟玩家主城
                level = '主城';
            }
            worldMap[x][y] = { type, level };
        }
    }
}

// 屏幕分辨率适配 (解决iOS Retina屏模糊问题)
function resize() {
    state.screen.dpr = window.devicePixelRatio || 1;
    state.screen.width = window.innerWidth;
    state.screen.height = window.innerHeight;
    
    // 物理像素放大
    canvas.width = state.screen.width * state.screen.dpr;
    canvas.height = state.screen.height * state.screen.dpr;
    
    // 缩放上下文
    ctx.scale(state.screen.dpr, state.screen.dpr);
    ctx.imageSmoothingEnabled = false; // 禁用平滑，保留像素风格或提高2D性能
}

// 游戏核心渲染引擎（带Camera视野裁剪）
function render() {
    // 清屏
    ctx.fillStyle = "#1a1c1e";
    ctx.fillRect(0, 0, state.screen.width, state.screen.height);

    ctx.save();
    // 应用摄像机位移与缩放
    ctx.translate(state.screen.width / 2, state.screen.height / 2);
    ctx.scale(state.camera.zoom, state.camera.zoom);
    ctx.translate(-state.camera.x, -state.camera.y);

    // 计算当前屏幕可见的格子范围（核心优化：视野外不渲染，防iOS卡死）
    const tileSize = CONFIG.TILE_SIZE;
    
    // 屏幕边界换算到世界坐标
    const leftW = state.camera.x - (state.screen.width / 2) / state.camera.zoom;
    const rightW = state.camera.x + (state.screen.width / 2) / state.camera.zoom;
    const topW = state.camera.y - (state.screen.height / 2) / state.camera.zoom;
    const bottomW = state.camera.y + (state.screen.height / 2) / state.camera.zoom;

    const startX = Math.max(0, Math.floor(leftW / tileSize));
    const endX = Math.min(CONFIG.MAP_WIDTH - 1, Math.floor(rightW / tileSize));
    const startY = Math.max(0, Math.floor(topW / tileSize));
    const endY = Math.min(CONFIG.MAP_HEIGHT - 1, Math.floor(bottomW / tileSize));

    // 渲染视野内的沙盘格子
    for (let x = startX; x <= endX; x++) {
        for (let y = startY; y <= endY; y++) {
            const tile = worldMap[x][y];
            const posX = x * tileSize;
            const posY = y * tileSize;

            // 1. 绘制底层土地
            if (images.grass) {
                ctx.drawImage(images.grass, posX, posY, tileSize, tileSize);
            }

            // 2. 如果是主城，绘制主城建筑
            if (tile.type === 'castle' && images.castle) {
                ctx.drawImage(images.castle, posX, posY, tileSize, tileSize);
            }

            // 3. 绘制绿地网格线
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            ctx.strokeRect(posX, posY, tileSize, tileSize);

            // 4. 绘制坐标与等级文本
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.font = "12px sans-serif";
            ctx.fillText(`Lv.${tile.level}`, posX + 10, posY + 25);
            ctx.fillText(`${x},${y}`, posX + 10, posY + tileSize - 10);

            // 5. 绘制选中特效
            if (state.selectedTile && state.selectedTile.x === x && state.selectedTile.y === y) {
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 3;
                ctx.strokeRect(posX + 2, posY + 2, tileSize - 4, tileSize - 4);
                ctx.fillStyle = "rgba(255, 204, 0, 0.15)";
                ctx.fillRect(posX + 2, posY + 2, tileSize - 4, tileSize - 4);
            }
        }
    }

    ctx.restore();
}

// 屏幕坐标转世界坐标
function screenToWorld(sX, sY) {
    const wX = (sX - state.screen.width / 2) / state.camera.zoom + state.camera.x;
    const wY = (sY - state.screen.height / 2) / state.camera.zoom + state.camera.y;
    return { x: wX, y: wY };
}

// 事件绑定：极速响应的 Touch 事件适配 iOS
function initEvents() {
    
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            state.touch.isDragging = true;
            state.touch.moved = false;
            state.touch.lastX = e.touches[0].clientX;
            state.touch.lastY = e.touches[0].clientY;
            state.touch.startX = e.touches[0].clientX;
            state.touch.startY = e.touches[0].clientY;
        }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
        if (!state.touch.isDragging) return;
        
        if (e.touches.length === 1) {
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            // 计算位移差
            const dx = currentX - state.touch.lastX;
            const dy = currentY - state.touch.lastY;
            
            // 移动摄像机 (注意方向相反)
            state.camera.x -= dx / state.camera.zoom;
            state.camera.y -= dy / state.camera.zoom;
            
            state.touch.lastX = currentX;
            state.touch.lastY = currentY;

            // 判断是否触发了真正的拖拽而非误触点击
            if (Math.abs(currentX - state.touch.startX) > 5 || Math.abs(currentY - state.touch.startY) > 5) {
                state.touch.moved = true;
            }
        }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
        if (!state.touch.isDragging) return;
        state.touch.isDragging = false;

        // 如果只是轻点，没有拖拽，则视为选择土地
        if (!state.touch.moved) {
            const worldPos = screenToWorld(state.touch.startX, state.touch.startY);
            const tileX = Math.floor(worldPos.x / CONFIG.TILE_SIZE);
            const tileY = Math.floor(worldPos.y / CONFIG.TILE_SIZE);

            if (tileX >= 0 && tileX < CONFIG.MAP_WIDTH && tileY >= 0 && tileY < CONFIG.MAP_HEIGHT) {
                state.selectedTile = { x: tileX, y: tileY };
                console.log(`点击了土地: [${tileX}, ${tileY}]`);
                // 商业逻辑：此处可触发自定义 iOS Haptic 反馈或打开UI弹窗
            }
        }
    });

    // 阻止iOS双击缩放页面的默认行为
    document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
    });
}

// 游戏主循环
function loop() {
    render();
    requestAnimationFrame(loop);
}

// 启动入口
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    initMap();
    resize();
    initEvents();
    loadAssets(() => {
        // 资源加载完毕，启动游戏
        requestAnimationFrame(loop);
    });
});
</script>
</body>
</html>
