<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Life 高性能粒子模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            font-family: 'Courier New', monospace;
            color: #00ff88;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        .ui-container {
            position: fixed;
            right: 10px;
            top: 10px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 100;
        }

        .toggle-btn {
            background: rgba(0, 255, 136, 0.3);
            border: 1.5px solid #00ff88;
            color: #00ff88;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .toggle-btn:hover {
            background: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel.active {
            max-height: 500px;
        }

        .stats {
            background: rgba(0, 255, 136, 0.15);
            border: 1.5px solid #00ff88;
            border-radius: 8px;
            padding: 10px 12px;
            backdrop-filter: blur(8px);
            font-size: 10px;
            line-height: 1.4;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
            animation: slideIn 0.3s ease-out;
            min-width: 130px;
        }

        .controls {
            background: rgba(0, 255, 136, 0.15);
            border: 1.5px solid #00ff88;
            border-radius: 8px;
            padding: 8px;
            backdrop-filter: blur(8px);
            font-size: 10px;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
            animation: slideIn 0.3s ease-out 0.05s backwards;
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .stat-row {
            margin-bottom: 2px;
            display: flex;
            gap: 6px;
            justify-content: space-between;
            min-width: 110px;
            font-size: 10px;
        }

        .stat-label {
            color: #00ff88;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .stat-value {
            color: #00ddff;
            font-weight: bold;
            min-width: 50px;
            text-align: right;
        }

        button {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 4px 8px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            white-space: nowrap;
        }

        button:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        .center-hint {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            text-align: center;
            animation: pulse 2s ease-in-out infinite, fadeInCenter 0.6s ease-out;
            pointer-events: none;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
            z-index: 40;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInCenter {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .ui-container {
                right: 8px;
                top: 8px;
            }

            .toggle-btn {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .center-hint {
                font-size: 11px;
                padding: 6px 12px;
                top: 50px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-container" id="uiContainer">
        <button class="toggle-btn" onclick="document.getElementById('uiPanel').classList.toggle('active')">⚙️</button>
        <div class="panel" id="uiPanel">
            <div class="stats">
                <div class="stat-row">
                    <span class="stat-label">粒子:</span>
                    <span class="stat-value" id="particleCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">FPS:</span>
                    <span class="stat-value" id="fps">60</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">更新:</span>
                    <span class="stat-value" id="computeTime">0ms</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">绘制:</span>
                    <span class="stat-value" id="drawTime">0ms</span>
                </div>
            </div>

            <div class="controls">
                <button onclick="window.particleLife.clear()">清空</button>
                <button onclick="window.particleLife.randomize()">填充</button>
                <button onclick="window.particleLife.togglePause()">暂停</button>
                <button onclick="window.particleLife.randomizeForces()">随机</button>
            </div>
        </div>
    </div>

    <div class="center-hint">
        👆 点击屏幕添加粒子
    </div>

    <script>
        class ParticleLife {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = canvas.width = window.innerWidth;
                this.height = canvas.height = window.innerHeight;
                
                // 粒子数据 - 使用TypedArray
                this.maxParticles = 10000;
                this.particleCount = 0;
                this.posX = new Float32Array(this.maxParticles);
                this.posY = new Float32Array(this.maxParticles);
                this.velX = new Float32Array(this.maxParticles);
                this.velY = new Float32Array(this.maxParticles);
                this.type = new Uint8Array(this.maxParticles);
                
                // 物理参数
                this.types = 4;
                this.friction = 0.95;
                this.maxVelocity = 5;
                this.forceScale = 0.2;
                this.interactionRadius = 100;
                this.interactionRadiusSq = this.interactionRadius * this.interactionRadius;
                
                // 力矩阵
                this.forceMatrix = this.initForceMatrix();
                
                // 颜色
                this.colors = [
                    '#00ff88',
                    '#00ddff',
                    '#ff0088',
                    '#ffc800'
                ];
                
                // 空间网格 - 用于快速碰撞检测
                this.cellSize = this.interactionRadius;
                this.gridWidth = Math.ceil(this.width / this.cellSize);
                this.gridHeight = Math.ceil(this.height / this.cellSize);
                this.grid = Array(this.gridWidth * this.gridHeight).fill(null).map(() => []);
                
                // 性能统计
                this.isPaused = false;
                this.lastTime = Date.now();
                this.frameCount = 0;
                this.fps = 60;
                this.computeTime = 0;
                this.drawTime = 0;
                
                this.setupEventListeners();
                this.animate();
            }

            initForceMatrix() {
                const matrix = new Float32Array(this.types * this.types);
                for (let i = 0; i < this.types * this.types; i++) {
                    matrix[i] = Math.random() * 2 - 1;
                }
                return matrix;
            }

            getForce(fromType, toType) {
                return this.forceMatrix[fromType * this.types + toType];
            }

            setupEventListeners() {
                this.canvas.addEventListener('click', (e) => this.addParticlesAtPoint(e.clientX, e.clientY));
                this.canvas.addEventListener('mousemove', (e) => {
                    if (e.buttons === 1) {
                        this.addParticlesAtPoint(e.clientX, e.clientY, 1);
                    }
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.addParticlesAtPoint(touch.clientX, touch.clientY);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.addParticlesAtPoint(touch.clientX, touch.clientY, 1);
                }, { passive: false });

                window.addEventListener('resize', () => {
                    this.width = this.canvas.width = window.innerWidth;
                    this.height = this.canvas.height = window.innerHeight;
                    this.gridWidth = Math.ceil(this.width / this.cellSize);
                    this.gridHeight = Math.ceil(this.height / this.cellSize);
                });
            }

            addParticlesAtPoint(x, y, count = 3) {
                if (this.isPaused || this.particleCount >= this.maxParticles) return;
                
                count = Math.min(count, this.maxParticles - this.particleCount);
                for (let i = 0; i < count; i++) {
                    const idx = this.particleCount++;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2;
                    
                    this.posX[idx] = x + (Math.random() - 0.5) * 20;
                    this.posY[idx] = y + (Math.random() - 0.5) * 20;
                    this.velX[idx] = Math.cos(angle) * speed;
                    this.velY[idx] = Math.sin(angle) * speed;
                    this.type[idx] = Math.floor(Math.random() * this.types);
                }
            }

            clear() {
                this.particleCount = 0;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            randomize() {
                this.particleCount = 0;
                const count = Math.min(
                    Math.max(200, Math.floor((this.width * this.height) / 3000)),
                    this.maxParticles
                );
                
                for (let i = 0; i < count; i++) {
                    this.posX[i] = Math.random() * this.width;
                    this.posY[i] = Math.random() * this.height;
                    this.velX[i] = (Math.random() - 0.5) * 3;
                    this.velY[i] = (Math.random() - 0.5) * 3;
                    this.type[i] = Math.floor(Math.random() * this.types);
                }
                this.particleCount = count;
            }

            randomizeForces() {
                this.forceMatrix = this.initForceMatrix();
                this.particleCount = 0;
                this.randomize();
            }

            // 构建空间网格
            buildGrid() {
                // 清空网格
                for (let i = 0; i < this.grid.length; i++) {
                    this.grid[i].length = 0;
                }

                // 填充网格
                for (let i = 0; i < this.particleCount; i++) {
                    const cellX = Math.floor(this.posX[i] / this.cellSize);
                    const cellY = Math.floor(this.posY[i] / this.cellSize);
                    
                    if (cellX >= 0 && cellX < this.gridWidth && cellY >= 0 && cellY < this.gridHeight) {
                        const idx = cellY * this.gridWidth + cellX;
                        this.grid[idx].push(i);
                    }
                }
            }

            // 获取邻近粒子
            getNearbyParticles(particleIdx) {
                const cellX = Math.floor(this.posX[particleIdx] / this.cellSize);
                const cellY = Math.floor(this.posY[particleIdx] / this.cellSize);
                const nearby = [];

                // 检查3x3网格
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        const nx = cellX + dx;
                        const ny = cellY + dy;
                        
                        if (nx >= 0 && nx < this.gridWidth && ny >= 0 && ny < this.gridHeight) {
                            const idx = ny * this.gridWidth + nx;
                            nearby.push(...this.grid[idx]);
                        }
                    }
                }

                return nearby;
            }

            update() {
                if (this.isPaused) return;

                const startTime = performance.now();

                // 构建空间网格
                this.buildGrid();

                // 计算力和更新位置
                for (let i = 0; i < this.particleCount; i++) {
                    let fx = 0, fy = 0;

                    // 获取邻近粒子
                    const nearby = this.getNearbyParticles(i);

                    for (const j of nearby) {
                        if (i === j) continue;

                        const dx = this.posX[j] - this.posX[i];
                        const dy = this.posY[j] - this.posY[i];
                        const distSq = dx * dx + dy * dy;

                        if (distSq < this.interactionRadiusSq && distSq > 1) {
                            const dist = Math.sqrt(distSq);
                            const force = this.getForce(this.type[i], this.type[j]) * 
                                         (1 - dist / this.interactionRadius);
                            const angle = Math.atan2(dy, dx);

                            fx += Math.cos(angle) * force * this.forceScale;
                            fy += Math.sin(angle) * force * this.forceScale;
                        }
                    }

                    // 应用力
                    this.velX[i] += fx;
                    this.velY[i] += fy;

                    // 限制速度
                    const speedSq = this.velX[i] * this.velX[i] + this.velY[i] * this.velY[i];
                    if (speedSq > this.maxVelocity * this.maxVelocity) {
                        const speed = Math.sqrt(speedSq);
                        this.velX[i] = (this.velX[i] / speed) * this.maxVelocity;
                        this.velY[i] = (this.velY[i] / speed) * this.maxVelocity;
                    }

                    // 摩擦
                    this.velX[i] *= this.friction;
                    this.velY[i] *= this.friction;

                    // 位置更新
                    this.posX[i] += this.velX[i];
                    this.posY[i] += this.velY[i];

                    // 环绕边界
                    if (this.posX[i] < 0) this.posX[i] += this.width;
                    if (this.posX[i] > this.width) this.posX[i] -= this.width;
                    if (this.posY[i] < 0) this.posY[i] += this.height;
                    if (this.posY[i] > this.height) this.posY[i] -= this.height;
                }

                this.computeTime = (performance.now() - startTime).toFixed(1);
            }

            draw() {
                const startTime = performance.now();

                // 清除画布（尾迹效果）
                this.ctx.fillStyle = 'rgba(10, 14, 39, 0.15)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // 绘制粒子
                for (let i = 0; i < this.particleCount; i++) {
                    this.ctx.fillStyle = this.colors[this.type[i]];
                    this.ctx.beginPath();
                    this.ctx.arc(this.posX[i], this.posY[i], 0.5, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                this.drawTime = (performance.now() - startTime).toFixed(1);
            }

            updateStats() {
                document.getElementById('particleCount').textContent = this.particleCount;
                document.getElementById('fps').textContent = this.fps;
                document.getElementById('computeTime').textContent = this.computeTime + 'ms';
                document.getElementById('drawTime').textContent = this.drawTime + 'ms';
            }

            animate() {
                // FPS计算
                this.frameCount++;
                const now = Date.now();
                if (now - this.lastTime >= 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastTime = now;
                    this.updateStats();
                }

                this.update();
                this.draw();

                requestAnimationFrame(() => this.animate());
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            window.particleLife = new ParticleLife(canvas);
            window.particleLife.randomize();
        });
    </script>
</body>
</html>
