<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境交流</title>
    <style>
        :root {
            --tg-blue: #24A1DE;
            --bg-color: #f4f7f9;
            --text-color: #2c3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: var(--tg-blue);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: white;
        }

        h1 { margin: 10px 0; font-size: 1.4rem; }
        p { color: #666; font-size: 0.95rem; margin-bottom: 2rem; }

        .btn {
            display: block;
            background-color: var(--tg-blue);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        /* Footer 样式 */
        .footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #a0a0a0;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="avatar">🕊️</div>
    <h1>跨境交流</h1>
    <p>点击下方按钮直接跳转至 Telegram 频道，获取一手资讯。</p>
    
    <a href="https://t.me/+vBU9IYaRHRZjMmIx" class="btn" target="_blank">加入 Telegram 频道</a>

    <div class="footer" id="footer-content">
        &copy; <span id="year"></span> <span id="domain"></span>. All Rights Reserved.
    </div>
</div>

<script>
    // 自动获取当前年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 自动获取当前域名 (如果是本地文件则显示 'Local File')
    const domain = window.location.hostname;
    document.getElementById('domain').textContent = domain ? domain : "Localhost";
</script>

</body>
</html>
