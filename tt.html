<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MiniMax TTS 测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
        #status { margin-top: 10px; color: #666; }
    </style>
</head>
<body>

    <h2>MiniMax 语音合成测试</h2>
    <button id="generateBtn">生成并播放语音</button>
    <div id="status">准备就绪</div>
    <audio id="audioPlayer" controls style="display:block; margin-top: 20px;"></audio>

    <script>
        const API_KEY = 'sk-cp-9p9ImZG_33-dnQY8II1RB1DZOhoRV0qaDYoo0VUhnW4xa7TNM5AoF3N_IEGRkjX0Zdc68DbBFzuXrOtl9jGJp-5B21VhLyl0RrMErZFbt9TgomWxjz3YDcY'; // 请务必妥善保管
        const btn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');

        btn.addEventListener('click', async () => {
            status.innerText = "正在生成中...";
            btn.disabled = true;

            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer sk-cp-9p9ImZG_33-dnQY8II1RB1DZOhoRV0qaDYoo0VUhnW4xa7TNM5AoF3N_IEGRkjX0Zdc68DbBFzuXrOtl9jGJp-5B21VhLyl0RrMErZFbt9TgomWxjz3YDcY'
                },
                body: JSON.stringify({
                    model: 'speech-2.8-hd',
                    text: '今天是不是很开心呀(laughs)，当然了！',
                    stream: false,
                    voice_setting: {voice_id: 'male-qn-qingse', speed: 1, vol: 1, pitch: 0, emotion: 'happy'},
                    audio_setting: {sample_rate: 32000, bitrate: 128000, format: 'mp3', channel: 1},
                    pronunciation_dict: {tone: ['处理/(chu3)(li3)', '危险/dangerous']},
                    subtitle_enable: false
                })
            };

            try {
                const response = await fetch('https://api.minimaxi.com/v1/t2a_v2', options);
                const data = await response.json();

                if (data.audio) {
                    // 将 Base64 音频数据赋值给 audio 标签
                    audioPlayer.src = `data:audio/mp3;base64,${data.audio}`;
                    audioPlayer.play();
                    status.innerText = "生成成功！";
                } else {
                    status.innerText = "错误: " + (data.base_resp?.status_msg || "未知错误");
                }
            } catch (err) {
                status.innerText = "请求失败: " + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
