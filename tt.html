<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Audio Playback</title>
</head>
<body>

    <button id="playBtn" style="padding: 15px 30px; font-size: 16px;">合成并播放声音</button>

    <script>
        const playBtn = document.getElementById('playBtn');

        // 创建一个全局的 Audio 实例
        const audioPlayer = new Audio();

        playBtn.addEventListener('click', async () => {
            // 【iOS 关键破局点 1】: 在用户点击的第一时间，立刻调用一次 play()。
            // 哪怕此时没有音频地址，这一步也能向 iOS 系统宣告：“此音频对象已被用户授权，允许播放”。
            audioPlayer.play().catch(() => {/* 忽略暂无音频源的报错 */});

            playBtn.innerText = "正在合成...";
            playBtn.disabled = true;

            try {
                // 请求 MiniMax 接口 (注意：这里 stream 设为 false，以获取完整文件)
                const response = await fetch('https://api.minimaxi.com/v1/t2a_v2', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'sk-cp-9p9ImZG_33-dnQY8II1RB1DZOhoRV0qaDYoo0VUhnW4xa7TNM5AoF3N_IEGRkjX0Zdc68DbBFzuXrOtl9jGJp-5B21VhLyl0RrMErZFbt9TgomWxjz3YDcY' // 请替换为您新生成的 Key
                    },
                    body: JSON.stringify({
                        model: 'speech-2.8-hd',
                        text: '今天是不是很开心呀(laughs)，当然了！',
                        stream: false, 
                        voice_setting: { voice_id: 'male-qn-qingse', speed: 1, vol: 1, pitch: 0, emotion: 'happy' },
                        audio_setting: { sample_rate: 32000, bitrate: 128000, format: 'mp3', channel: 1 },
                        pronunciation_dict: { tone: ['处理/(chu3)(li3)', '危险/dangerous'] },
                        subtitle_enable: false
                    })
                });

                const result = await response.json();
                
                // 拿到 base64 音频数据
                const base64Audio = result.data.audio; 
                
                // 将 base64 转换为 Blob URL
                const binary = atob(base64Audio);
                const array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                const blob = new Blob([new Uint8Array(array)], { type: 'audio/mp3' });
                const audioUrl = URL.createObjectURL(blob);

                // 【iOS 关键破局点 2】: 替换 src 并重新播放
                audioPlayer.src = audioUrl;
                await audioPlayer.play();
                
                playBtn.innerText = "播放中...";
                audioPlayer.onended = () => {
                    playBtn.innerText = "合成并播放声音";
                    playBtn.disabled = false;
                };

            } catch (err) {
                console.error("播放失败: ", err);
                playBtn.innerText = "合成失败，再试一次";
                playBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
