<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 适配版 WebSSH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <style>
        :root { --panel-height: 140px; --key-height: 44px; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #000; color: #fff; overflow: hidden; position: fixed; 
        }
        /* 配置面板 */
        .config-panel { 
            height: var(--panel-height); padding: 10px; box-sizing: border-box;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #222;
        }
        input { background: #333; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; }
        button#conn-btn { grid-column: span 2; background: #007acc; border: none; color: #fff; padding: 10px; border-radius: 4px; }
        
        /* 终端容器：动态计算高度 */
        #terminal-container { 
            height: calc(100% - var(--panel-height) - var(--key-height)); 
            width: 100%; background: #000;
        }

        /* 移动端虚拟按键栏 */
        .helper-bar {
            height: var(--key-height); background: #333;
            display: flex; overflow-x: auto; align-items: center; padding: 0 5px; gap: 5px;
        }
        .key-btn { 
            min-width: 50px; height: 34px; background: #444; border: none; 
            color: #fff; border-radius: 4px; font-size: 12px; flex-shrink: 0;
        }
        .key-btn:active { background: #666; }

        #status { font-size: 12px; text-align: center; grid-column: span 2; }
    </style>
</head>
<body>

<div class="config-panel">
    <input id="host" type="text" placeholder="主机" value="127.0.0.1">
    <input id="user" type="text" placeholder="用户" value="root">
    <input id="pass" type="password" placeholder="密码">
    <input id="port" type="number" value="22">
    <button id="conn-btn" onclick="connect()">连接服务器</button>
    <div id="status">未连接</div>
</div>

<div class="helper-bar">
    <button class="key-btn" onclick="send('\x1b')">ESC</button>
    <button class="key-btn" onclick="send('\x09')">Tab</button>
    <button class="key-btn" onclick="send('\x03')">Ctrl+C</button>
    <button class="key-btn" onclick="send('\x1b[A')">↑</button>
    <button class="key-btn" onclick="send('\x1b[B')">↓</button>
    <button class="key-btn" onclick="send('\x1b[D')">←</button>
    <button class="key-btn" onclick="send('\x1b[C')">→</button>
</div>

<div id="terminal-container">
    <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>

<script>
    const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        theme: { background: '#000000' },
        convertEol: true
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    let socket;

    // 核心：处理 iOS 虚拟键盘弹出时的视口变化
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            const vh = window.visualViewport.height;
            // 重新计算终端高度，防止键盘遮挡
            const container = document.getElementById('terminal-container');
            container.style.height = `${vh - 140 - 44}px`;
            fitAddon.fit();
            if (socket?.readyState === 1) {
                socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        });
    }

    function send(data) {
        if (socket?.readyState === 1) socket.send(JSON.stringify({ type: 'input', data }));
    }

    function connect() {
        socket = new WebSocket('ws://149.88.75.118:8080');
        document.getElementById('status').innerText = '正在连接...';

        socket.onopen = () => {
            socket.send(JSON.stringify({
                type: 'connect',
                host: document.getElementById('host').value,
                username: document.getElementById('user').value,
                password: document.getElementById('pass').value,
                port: document.getElementById('port').value,
                cols: term.cols, rows: term.rows
            }));
            term.focus(); // 自动聚焦弹出键盘
        };

        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'data') term.write(msg.data);
            if (msg.type === 'status' && msg.data === 'ssh-ready') {
                document.getElementById('status').innerText = '连接成功';
            }
        };

        socket.onclose = () => { document.getElementById('status').innerText = '连接断开'; };
    }

    term.onData(data => send(data));
</script>
</body>
</html>
