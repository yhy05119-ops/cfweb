<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<!-- 加到主屏幕后以全屏 App 模式打开（无 Safari 地址栏/工具条） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="纸间阅读">
<meta name="theme-color" content="#cdc0a1">
<title>纸间 · TXT 阅读器</title>
<style>
    :root {
        --paper: #cdc0a1;
        --paper-deep: #beae8a;
        --sheet-bg: #e7ddc3;
        --ink: #2e2413;
        --ink-soft: #6d5c3e;
        --accent: #6b4a2c;
        --accent-ink: #f3e9d2;
        --highlight: rgba(214, 158, 46, 0.4);
        --divider: rgba(46, 36, 19, 0.14);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
    }
    body.dark {
        --paper: #1c1913;
        --paper-deep: #14120d;
        --sheet-bg: #26221a;
        --ink: #d9cbaa;
        --ink-soft: #a19271;
        --accent: #c99a5b;
        --accent-ink: #241c10;
        --highlight: rgba(255, 205, 110, 0.28);
        --divider: rgba(217, 203, 170, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    button { -webkit-appearance: none; appearance: none; }
    html, body {
        margin: 0;
        height: 100%;
        height: 100dvh; /* 用动态视口高度，避免 iOS 地址栏收起/展开时页面高度跳动 */
        background: var(--paper);
        overscroll-behavior: none; /* 禁止整页橡皮筋回弹，露出底下的白色空白 */
        touch-action: pan-y;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: background 0.3s, color 0.3s;
        padding-top: var(--safe-top); /* 刘海屏/全屏模式下避开顶部安全区 */
    }
    .app-shell {
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        background: var(--paper);
    }

    /* ---------- 顶部栏 ---------- */
    #topBar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: var(--paper);
        border-bottom: 1px solid var(--divider);
        flex-shrink: 0;
    }
    #topBar .icon-btn {
        font-size: 20px;
        color: var(--ink);
        background: none;
        border: none;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
    }
    #fileLabel { cursor: pointer; }
    #fileInput { display: none; }
    #bookTitle {
        flex: 1;
        font-size: 15px;
        color: var(--ink-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
    }

    /* ---------- 阅读区 ---------- */
    #readerArea {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 28px 24px 120px;
    }
    #content {
        font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
        font-size: 19px;
        line-height: 2.15;
        letter-spacing: 0.02em;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: var(--ink);
    }
    .sentence { cursor: pointer; transition: background-color 0.2s, box-shadow 0.2s; border-radius: 3px; }
    .sentence.reading {
        background-color: var(--highlight);
        box-shadow: 0 0 0 2px var(--highlight);
    }
    .play-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9em;
        height: 1.9em;
        min-width: 26px;
        min-height: 26px;
        margin-right: 0.3em;
        border-radius: 50%;
        border: none;
        background: var(--divider);
        color: var(--accent);
        font-size: 0.8em;
        vertical-align: middle;
        cursor: pointer;
        flex-shrink: 0;
        transform: translateY(-0.1em);
        padding: 0;
    }
    .play-btn:active { background: var(--accent); color: var(--accent-ink); }

    /* ---------- 底部章节滑条 ---------- */
    #pageNav {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 20px 4px;
        background: var(--paper);
        flex-shrink: 0;
        font-size: 13px;
        color: var(--ink-soft);
    }
    #pageNav button {
        background: none;
        border: none;
        color: var(--ink-soft);
        font-size: 13px;
        cursor: pointer;
        padding: 6px 4px;
        white-space: nowrap;
    }
    #pageNav button:disabled { opacity: 0.4; cursor: not-allowed; }
    #pageSlider {
        flex: 1;
        -webkit-appearance: none;
        height: 4px;
        border-radius: 2px;
        background: var(--divider);
        outline: none;
    }
    #pageSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent-ink);
        border: 3px solid var(--accent);
        cursor: pointer;
    }
    #pageInfo { min-width: 70px; text-align: center; }

    /* ---------- 底部导航 ---------- */
    #bottomNav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 0 calc(8px + var(--safe-bottom));
        background: var(--paper);
        border-top: 1px solid var(--divider);
        flex-shrink: 0;
    }
    #bottomNav button {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--ink-soft);
        cursor: pointer;
        padding: 4px 10px;
    }
    #bottomNav button .icon { font-size: 20px; }
    #bottomNav button.active { color: var(--accent); }

    /* ---------- 悬浮听书按钮 ---------- */
    #listenBtn {
        position: absolute;
        right: 22px;
        bottom: 92px;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        cursor: pointer;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
    }
    #listenBtn:active { transform: scale(0.94); }
    #listenBtn.playing { background: var(--ink); color: var(--paper); }
    #listenStopBadge {
        position: absolute;
        right: 14px;
        bottom: 148px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--paper);
        border: none;
        font-size: 13px;
        cursor: pointer;
        z-index: 26;
        display: none;
        align-items: center;
        justify-content: center;
    }
    #ttsStatus {
        position: absolute;
        right: 22px;
        bottom: 158px;
        font-size: 11px;
        color: var(--ink-soft);
        background: var(--sheet-bg);
        padding: 3px 8px;
        border-radius: 10px;
        max-width: 200px;
        text-align: right;
        z-index: 24;
    }
    #ttsStatus:empty { display: none; }

    /* ---------- 底部弹层 ---------- */
    .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 40;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translate(-50%, 100%);
        width: 100%;
        max-width: 760px;
        max-height: 78vh;
        overscroll-behavior: contain;
        overflow-y: auto;
        background: var(--sheet-bg);
        border-radius: 18px 18px 0 0;
        padding: 18px 20px calc(20px + var(--safe-bottom));
        transition: transform 0.25s ease;
        z-index: 41;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.2);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet h3 {
        margin: 0 0 14px;
        font-size: 15px;
        color: var(--ink);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .sheet h3 .close-x { cursor: pointer; color: var(--ink-soft); font-size: 18px; }
    .field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin-bottom: 12px;
        align-items: center;
    }
    .field-row label {
        font-size: 13px;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .field-row input, .field-row select {
        font-size: 13px;
        padding: 5px 7px;
        border-radius: 6px;
        border: 1px solid var(--divider);
        background: var(--paper);
        color: var(--ink);
    }
    .sheet-divider { border: none; border-top: 1px solid var(--divider); margin: 14px 0; }
    button.tts-btn, .sheet button.pill {
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 16px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 13px;
    }
    button.tts-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sheet button.pill.outline {
        background: transparent;
        color: var(--ink-soft);
        border-color: var(--divider);
    }
    #debugLog {
        font-size: 11px;
        color: var(--ink-soft);
        background: var(--paper);
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 8px 10px;
        margin-top: 10px;
        max-height: 110px;
        overflow-y: auto;
        display: none;
        white-space: pre-wrap;
    }

    /* ---------- 单击隐藏/显示工具栏（沉浸阅读） ---------- */
    body.hidden-chrome #topBar,
    body.hidden-chrome #pageNav,
    body.hidden-chrome #bottomNav,
    body.hidden-chrome #listenBtn,
    body.hidden-chrome #listenStopBadge,
    body.hidden-chrome #ttsStatus {
        display: none;
    }
    body.hidden-chrome #readerArea {
        padding-top: 20px;
        padding-bottom: 20px;
    }
</style>
</head>
<body>
<div class="app-shell">

    <!-- 顶部栏 -->
    <div id="topBar">
        <label id="fileLabel" class="icon-btn" for="fileInput" title="打开 TXT 文件">‹ 📂</label>
        <input type="file" id="fileInput" accept=".txt">
        <span id="bookTitle">点击左侧图标选择 TXT 文件</span>
        <button class="icon-btn" onclick="changeFontSize(1)" title="放大字体">A+</button>
        <button class="icon-btn" onclick="changeFontSize(-1)" title="缩小字体">A-</button>
    </div>

    <!-- 阅读区 -->
    <div id="readerArea">
        <pre id="content">请点击左上角 📂 选择本地 TXT 文件开始阅读…</pre>
    </div>

    <!-- 悬浮听书按钮 -->
    <span id="ttsStatus"></span>
    <button id="listenStopBadge" onclick="stopReading()" title="停止朗读">✕</button>
    <button id="listenBtn" onclick="handleListenTap()">听</button>

    <!-- 章节滑条 -->
    <div id="pageNav">
        <button id="prevBtn" onclick="prevPage()">上一页</button>
        <input type="range" id="pageSlider" min="1" max="1" value="1" oninput="onSliderInput()">
        <span id="pageInfo">1 / 1</span>
        <button id="nextBtn" onclick="nextPage()">下一页</button>
    </div>

    <!-- 底部导航 -->
    <div id="bottomNav">
        <button onclick="openSheet('sheetCatalog')"><span class="icon">📖</span>目录</button>
        <button id="darkToggleBtn" onclick="toggleDark()"><span class="icon">🌙</span>夜间</button>
        <button onclick="openSheet('sheetVoice')"><span class="icon">🔊</span>朗读</button>
        <button onclick="openSheet('sheetMore')"><span class="icon">⋯</span>更多</button>
    </div>

    <!-- 弹层：目录/翻页 -->
    <div class="sheet-backdrop" id="backdropCatalog" onclick="closeSheet('sheetCatalog')"></div>
    <div class="sheet" id="sheetCatalog">
        <h3>目录 / 翻页 <span class="close-x" onclick="closeSheet('sheetCatalog')">✕</span></h3>
        <div class="field-row">
            <label>每页字数
                <select id="pageSizeSelect" onchange="onPageSizeChange()">
                    <option value="500">500</option>
                    <option value="1000" selected>1000</option>
                    <option value="2000">2000</option>
                    <option value="4000">4000</option>
                </select>
            </label>
            <label>跳转到第
                <input type="number" id="pageJump" min="1" value="1" style="width:60px;" onkeydown="if(event.key==='Enter') jumpToPage()">
                页
            </label>
            <button class="pill" onclick="jumpToPage()">跳转</button>
        </div>
    </div>

    <!-- 弹层：朗读设置 -->
    <div class="sheet-backdrop" id="backdropVoice" onclick="closeSheet('sheetVoice')"></div>
    <div class="sheet" id="sheetVoice">
        <h3>朗读设置 <span class="close-x" onclick="closeSheet('sheetVoice')">✕</span></h3>
        <div class="field-row">
            <label>API Key
                <input type="password" id="apiKeyInput" placeholder="MiniMax API Key" style="width:180px;">
            </label>
            <label>代理地址
                <input type="text" id="proxyUrlInput" placeholder="留空=直连(可能被CORS拦截)" style="width:190px;">
            </label>
        </div>
        <div class="field-row">
            <label>音色
                <select id="voiceSelect">
                    <option value="audiobook_male_1">audiobook_male_1（男声·朗读）</option>
                    <option value="audiobook_female_1">audiobook_female_1（女声·朗读）</option>
                    <option value="male-qn-qingse">male-qn-qingse（男声·阳光）</option>
                    <option value="female-shaonv">female-shaonv（女声·少女）</option>
                    <option value="custom">自定义 voice_id...</option>
                </select>
            </label>
            <input type="text" id="customVoiceInput" placeholder="自定义 voice_id" style="display:none; width:140px;">
        </div>
        <div class="field-row">
            <label>语速
                <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
                <span id="speedVal">1.0</span>
            </label>
            <label>预取阈值
                <input type="number" id="prefetchThresholdInput" min="1" max="99" value="60" style="width:50px;">%
            </label>
        </div>
        <div class="field-row">
            <label>从第
                <input type="number" id="startFromInput" min="1" value="1" style="width:50px;">
                句开始
            </label>
            <button class="pill" onclick="startReading(true)">跳转朗读</button>
        </div>
        <hr class="sheet-divider">
        <div class="field-row">
            <button class="tts-btn" id="ttsPlayBtn" onclick="startReading()">▶ 从头朗读本页</button>
            <button class="tts-btn" id="ttsPauseBtn" onclick="togglePause()" disabled>暂停</button>
            <button class="tts-btn" id="ttsStopBtn" onclick="stopReading()" disabled>停止</button>
        </div>
    </div>

    <!-- 弹层：更多（高级参数 + 调试） -->
    <div class="sheet-backdrop" id="backdropMore" onclick="closeSheet('sheetMore')"></div>
    <div class="sheet" id="sheetMore">
        <h3>高级参数 <span class="close-x" onclick="closeSheet('sheetMore')">✕</span></h3>
        <div class="field-row">
            <label>模型
                <select id="modelSelect">
                    <option value="speech-2.8-hd" selected>speech-2.8-hd</option>
                    <option value="speech-2.8-turbo">speech-2.8-turbo</option>
                    <option value="speech-2.6-hd">speech-2.6-hd</option>
                    <option value="speech-2.6-turbo">speech-2.6-turbo</option>
                    <option value="speech-02-hd">speech-02-hd</option>
                    <option value="speech-02-turbo">speech-02-turbo</option>
                    <option value="speech-01-hd">speech-01-hd</option>
                    <option value="speech-01-turbo">speech-01-turbo</option>
                </select>
            </label>
            <label>音量
                <input type="number" id="volInput" min="0.1" max="10" step="0.1" value="1" style="width:55px;">
            </label>
            <label>语调
                <input type="number" id="pitchInput" min="-12" max="12" step="1" value="0" style="width:50px;">
            </label>
        </div>
        <div class="field-row">
            <label>情绪
                <select id="emotionSelect">
                    <option value="" selected>不指定</option>
                    <option value="happy">happy 高兴</option>
                    <option value="sad">sad 悲伤</option>
                    <option value="angry">angry 愤怒</option>
                    <option value="fearful">fearful 害怕</option>
                    <option value="disgusted">disgusted 厌恶</option>
                    <option value="surprised">surprised 惊讶</option>
                    <option value="calm">calm 平静</option>
                </select>
            </label>
            <label>语言增强
                <select id="languageBoostSelect">
                    <option value="auto" selected>auto</option>
                    <option value="Chinese">Chinese</option>
                    <option value="English">English</option>
                    <option value="Chinese,Yue">粤语</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Korean">Korean</option>
                </select>
            </label>
        </div>
        <div class="field-row">
            <label>采样率
                <select id="sampleRateSelect">
                    <option value="8000">8000</option>
                    <option value="16000">16000</option>
                    <option value="22050">22050</option>
                    <option value="24000">24000</option>
                    <option value="32000" selected>32000</option>
                    <option value="44100">44100</option>
                </select>
            </label>
            <label>比特率
                <select id="bitrateSelect">
                    <option value="32000">32000</option>
                    <option value="64000">64000</option>
                    <option value="128000" selected>128000</option>
                    <option value="256000">256000</option>
                </select>
            </label>
            <label>格式
                <select id="formatSelect">
                    <option value="mp3" selected>mp3</option>
                    <option value="wav">wav</option>
                    <option value="pcm">pcm</option>
                    <option value="flac">flac</option>
                </select>
            </label>
            <label>声道
                <select id="channelSelect">
                    <option value="1" selected>单声道</option>
                    <option value="2">双声道</option>
                </select>
            </label>
        </div>
        <div class="field-row">
            <button class="pill outline" onclick="resetAdvancedSettings()">恢复默认</button>
            <button class="pill outline" onclick="clearSavedSettings()">清除本地保存的配置</button>
        </div>
        <hr class="sheet-divider">
        <div id="debugLog"></div>
    </div>

<script>
    // ================= 页面读取与分页 =================
    const fileInput = document.getElementById('fileInput');
    const content = document.getElementById('content');
    const bookTitle = document.getElementById('bookTitle');
    const pageNav = document.getElementById('pageNav');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageSlider = document.getElementById('pageSlider');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const pageJump = document.getElementById('pageJump');
    const readerArea = document.getElementById('readerArea');
    const startFromInput = document.getElementById('startFromInput');
    const prefetchThresholdInput = document.getElementById('prefetchThresholdInput');
    const modelSelect = document.getElementById('modelSelect');
    const volInput = document.getElementById('volInput');
    const pitchInput = document.getElementById('pitchInput');
    const emotionSelect = document.getElementById('emotionSelect');
    const languageBoostSelect = document.getElementById('languageBoostSelect');
    const sampleRateSelect = document.getElementById('sampleRateSelect');
    const bitrateSelect = document.getElementById('bitrateSelect');
    const formatSelect = document.getElementById('formatSelect');
    const channelSelect = document.getElementById('channelSelect');

    let fullText = '';
    let pages = [];
    let currentPage = 0;
    let pageSize = 1000;
    let fontSize = 19;

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        stopReading();
        bookTitle.textContent = file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = e.target.result;
            fullText = decodeText(buffer);
            pageSize = parseInt(pageSizeSelect.value, 10);
            splitIntoPages();
            currentPage = 0;
            renderPage();
            pageNav.style.display = 'flex';
        };
        reader.readAsArrayBuffer(file);
    });

    function decodeText(buffer) {
        // 优先尝试严格 UTF-8 解码，失败则回退到 GB18030（兼容 GBK/GB2312）
        try {
            const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
            return utf8Decoder.decode(buffer);
        } catch (err) {
            const gbDecoder = new TextDecoder('gb18030', { fatal: false });
            return gbDecoder.decode(buffer);
        }
    }

    function splitIntoPages() {
        pages = [];
        let pos = 0;
        const len = fullText.length;
        while (pos < len) {
            let end = Math.min(pos + pageSize, len);
            if (end < len) {
                const nextBreak = fullText.indexOf('\n', end);
                const searchLimit = Math.min(end + 200, len);
                if (nextBreak !== -1 && nextBreak <= searchLimit) {
                    end = nextBreak + 1;
                }
            }
            pages.push(fullText.slice(pos, end));
            pos = end;
        }
        if (pages.length === 0) pages.push('');
        pageSlider.max = pages.length;
    }

    // 把当前页文本切成句子数组，并用 <span class="sentence"> 包裹渲染
    function getPageSentences(pageText) {
        const matches = pageText.match(/[^。！？!?.\n]+[。！？!?.]*|\n/g) || [pageText];
        return matches.filter(s => s.trim().length > 0 || s === '\n');
    }

    function renderPage() {
        const sentences = getPageSentences(pages[currentPage] || '');
        // 用 DocumentFragment 一次性插入，避免逐个 appendChild 造成多次重排
        const frag = document.createDocumentFragment();
        // 用单独的计数器给"真正会被朗读"的句子编号，跳过换行符——
        // 这样这里的下标才能和 startReading() 里过滤掉空白后的 sentenceSpans 数组一一对应
        let readableIdx = 0;
        sentences.forEach((s) => {
            if (s !== '\n') {
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.dataset.idx = readableIdx;
                btn.textContent = '▶';
                btn.title = '从这句开始朗读';
                frag.appendChild(btn);

                const span = document.createElement('span');
                span.className = 'sentence';
                span.dataset.idx = readableIdx;
                span.textContent = s;
                frag.appendChild(span);
                readableIdx++;
            } else {
                const span = document.createElement('span');
                span.className = 'sentence-break';
                span.textContent = s;
                frag.appendChild(span);
            }
        });
        content.innerHTML = '';
        content.appendChild(frag);
        content.title = '点击 ▶ 从该句开始朗读；点击文字空白处隐藏/显示工具栏';

        pageInfo.textContent = `${currentPage + 1} / ${pages.length}`;
        pageJump.value = currentPage + 1;
        pageSlider.value = currentPage + 1;
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === pages.length - 1;
        readerArea.scrollTop = 0;
    }

    // 事件委托：给 #content 只挂一个 click 监听器，
    // 而不是给每个句子/按钮单独绑定——句子多的大页面下能明显减少内存和绑定耗时
    content.addEventListener('click', (e) => {
        const playBtn = e.target.closest('.play-btn');
        if (playBtn) {
            e.stopPropagation();
            const idx = parseInt(playBtn.dataset.idx, 10);
            startFromInput.value = idx + 1;
            startReading(true);
            return;
        }
        e.stopPropagation();
        toggleChrome();
    });

    // 点击阅读区空白处（#content 之外的留白）也切换工具栏显隐
    readerArea.addEventListener('click', () => { toggleChrome(); });

    function toggleChrome() {
        document.body.classList.toggle('hidden-chrome');
    }

    function prevPage() {
        if (currentPage > 0) { stopReading(); currentPage--; renderPage(); }
    }
    function nextPage() {
        if (currentPage < pages.length - 1) { stopReading(); currentPage++; renderPage(); }
    }
    function jumpToPage() {
        let target = parseInt(pageJump.value, 10);
        if (isNaN(target)) return;
        target = Math.max(1, Math.min(pages.length, target));
        stopReading();
        currentPage = target - 1;
        renderPage();
        closeSheet('sheetCatalog');
    }
    function onSliderInput() {
        let target = parseInt(pageSlider.value, 10);
        target = Math.max(1, Math.min(pages.length, target));
        stopReading();
        currentPage = target - 1;
        renderPage();
    }
    function onPageSizeChange() {
        if (!fullText) return;
        stopReading();
        pageSize = parseInt(pageSizeSelect.value, 10);
        splitIntoPages();
        currentPage = 0;
        renderPage();
    }
    function changeFontSize(delta) {
        fontSize = Math.max(12, Math.min(32, fontSize + delta * 2));
        content.style.fontSize = fontSize + 'px';
        saveSettings();
    }

    // ================= 深色模式 =================
    function toggleDark() {
        document.body.classList.toggle('dark');
        document.getElementById('darkToggleBtn').classList.toggle('active');
        saveSettings();
    }

    // ================= 底部弹层 =================
    function openSheet(id) {
        const backdropId = 'backdrop' + id.replace('sheet', '');
        document.getElementById(id).classList.add('open');
        const bd = document.getElementById(backdropId);
        if (bd) bd.classList.add('open');
    }
    function closeSheet(id) {
        const backdropId = 'backdrop' + id.replace('sheet', '');
        document.getElementById(id).classList.remove('open');
        const bd = document.getElementById(backdropId);
        if (bd) bd.classList.remove('open');
    }

    // ================= 本地保存参数配置 =================
    const SETTINGS_KEY = 'txtReaderSettings_v1';
    const persistFieldIds = [
        'apiKeyInput', 'proxyUrlInput', 'voiceSelect', 'customVoiceInput',
        'prefetchThresholdInput', 'startFromInput',
        'modelSelect', 'volInput', 'pitchInput', 'emotionSelect', 'languageBoostSelect',
        'sampleRateSelect', 'bitrateSelect', 'formatSelect', 'channelSelect',
        'pageSizeSelect'
    ];

    function saveSettings() {
        const obj = {};
        persistFieldIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) obj[id] = el.value;
        });
        obj.speed = speedRange.value;
        obj.fontSize = fontSize;
        obj.dark = document.body.classList.contains('dark');
        try {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj));
        } catch (e) {
            console.warn('保存设置失败：', e);
        }
    }

    function loadSettings() {
        let obj;
        try {
            const raw = localStorage.getItem(SETTINGS_KEY);
            if (!raw) return;
            obj = JSON.parse(raw);
        } catch (e) {
            console.warn('读取保存的设置失败：', e);
            return;
        }
        persistFieldIds.forEach(id => {
            const el = document.getElementById(id);
            if (el && obj[id] !== undefined) el.value = obj[id];
        });
        if (obj.speed !== undefined) {
            speedRange.value = obj.speed;
            speedVal.textContent = parseFloat(obj.speed).toFixed(1);
        }
        if (obj.fontSize !== undefined) {
            fontSize = obj.fontSize;
            content.style.fontSize = fontSize + 'px';
        }
        if (obj.dark) {
            document.body.classList.add('dark');
            document.getElementById('darkToggleBtn').classList.add('active');
        }
        // 恢复"自定义 voice_id"输入框的显隐状态
        customVoiceInput.style.display = voiceSelect.value === 'custom' ? 'inline-block' : 'none';
    }

    function clearSavedSettings() {
        localStorage.removeItem(SETTINGS_KEY);
        alert('已清除本地保存的参数配置，刷新页面后恢复默认值');
    }

    // 所有会被保存的输入项，变化时自动保存
    function bindAutoSave() {
        persistFieldIds.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('change', saveSettings);
        });
        speedRange.addEventListener('change', saveSettings);
    }
    const voiceSelect = document.getElementById('voiceSelect');
    const customVoiceInput = document.getElementById('customVoiceInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const proxyUrlInput = document.getElementById('proxyUrlInput');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const ttsStatus = document.getElementById('ttsStatus');
    const ttsPlayBtn = document.getElementById('ttsPlayBtn');
    const ttsPauseBtn = document.getElementById('ttsPauseBtn');
    const ttsStopBtn = document.getElementById('ttsStopBtn');
    const listenBtn = document.getElementById('listenBtn');
    const listenStopBadge = document.getElementById('listenStopBadge');

    voiceSelect.addEventListener('change', () => {
        customVoiceInput.style.display = voiceSelect.value === 'custom' ? 'inline-block' : 'none';
    });
    speedRange.addEventListener('input', () => { speedVal.textContent = parseFloat(speedRange.value).toFixed(1); });

    let currentAudio = null;
    let isReading = false;
    let isPaused = false;
    let readIndex = 0;
    let sentenceSpans = [];
    let ttsAudioEl = null; // 复用同一个 Audio 元素以绕过 iOS 自动播放限制

    // 全局错误兜底：iOS Safari 上普通用户看不到控制台，
    // 任何没被内部 try/catch 捕获的错误都在这里强制弹窗，避免"静默失败"
    const debugLog = document.getElementById('debugLog');
    function logDebug(msg) {
        debugLog.style.display = 'block';
        const time = new Date().toLocaleTimeString();
        const lines = debugLog.textContent ? debugLog.textContent.split('\n') : [];
        lines.push(`[${time}] ${msg}`);
        // 只保留最近 200 行，避免长时间朗读后日志无限增长拖慢页面
        if (lines.length > 200) lines.splice(0, lines.length - 200);
        debugLog.textContent = lines.join('\n');
        debugLog.scrollTop = debugLog.scrollHeight;
    }
    window.addEventListener('unhandledrejection', function(event) {
        const msg = (event.reason && event.reason.message) ? event.reason.message : String(event.reason);
        console.error('未捕获的 Promise 错误：', event.reason);
        logDebug('未捕获错误：' + msg);
        alert('出现未处理的错误：' + msg);
        stopReading();
    });
    window.addEventListener('error', function(event) {
        console.error('脚本错误：', event.error || event.message);
        logDebug('脚本错误：' + event.message + '（第 ' + event.lineno + ' 行）');
        alert('脚本出错：' + event.message + '（第 ' + event.lineno + ' 行）');
    });

    function getVoiceId() {
        return voiceSelect.value === 'custom' ? (customVoiceInput.value.trim() || 'audiobook_male_1') : voiceSelect.value;
    }

    // 悬浮"听"按钮：根据当前状态决定 开始 / 暂停 / 继续
    function handleListenTap() {
        if (!isReading) {
            startReading();
        } else {
            togglePause();
        }
    }
    function updateListenBtnUI() {
        if (isReading && !isPaused) {
            listenBtn.textContent = '⏸';
            listenBtn.classList.add('playing');
            listenStopBadge.style.display = 'flex';
        } else if (isReading && isPaused) {
            listenBtn.textContent = '▶';
            listenBtn.classList.add('playing');
            listenStopBadge.style.display = 'flex';
        } else {
            listenBtn.textContent = '听';
            listenBtn.classList.remove('playing');
            listenStopBadge.style.display = 'none';
        }
    }

    async function startReading(useStartFrom) {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert('请先在"朗读设置"里输入你的 MiniMax API Key');
            openSheet('sheetVoice');
            return;
        }
        sentenceSpans = Array.from(content.querySelectorAll('.sentence')).filter(s => s.textContent.trim().length > 0);
        if (sentenceSpans.length === 0) {
            alert('当前页没有可朗读的文本');
            return;
        }
        isReading = true;
        isPaused = false;

        if (useStartFrom) {
            let start = parseInt(startFromInput.value, 10);
            if (isNaN(start) || start < 1) start = 1;
            if (start > sentenceSpans.length) start = sentenceSpans.length;
            readIndex = start - 1;
        } else {
            readIndex = 0;
            startFromInput.value = 1;
        }

        ttsPlayBtn.disabled = true;
        ttsPauseBtn.disabled = false;
        ttsStopBtn.disabled = false;
        ttsPauseBtn.textContent = '暂停';
        updateListenBtnUI();

        // 直接使用同一个 Audio 元素播放，且必须在用户点击的调用栈里
        // 就绪（无论是点按钮还是点句子），这样 iOS 才认可后续异步 play()
        if (!ttsAudioEl) {
            ttsAudioEl = new Audio();
            ttsAudioEl.playsInline = true;
        }
        currentAudio = ttsAudioEl;

        await readLoop();
    }

    async function readLoop() {
        while (isReading && readIndex < sentenceSpans.length) {
            if (isPaused) {
                await sleep(200);
                continue;
            }
            const span = sentenceSpans[readIndex];
            highlightSentence(span);
            startFromInput.value = readIndex + 1;
            try {
                // 如果上一句播放到设定进度时已经预取过，直接复用
                let audioUrl;
                if (prefetchCache[readIndex]) {
                    ttsStatus.textContent = `使用预取音频 (${readIndex + 1}/${sentenceSpans.length})`;
                    audioUrl = await prefetchCache[readIndex];
                    delete prefetchCache[readIndex];
                }
                if (!audioUrl) {
                    ttsStatus.textContent = `合成中 (${readIndex + 1}/${sentenceSpans.length})...`;
                    logDebug(`请求合成第 ${readIndex + 1} 句：「${span.textContent.slice(0, 20)}」`);
                    audioUrl = await synthesize(span.textContent);
                }
                logDebug('合成成功，开始播放');
                if (!isReading) break;
                ttsStatus.textContent = `朗读中 (${readIndex + 1}/${sentenceSpans.length})`;
                const thisIndex = readIndex;
                await playAudio(audioUrl, () => {
                    // 播放进度到设定阈值时，提前把下一句音频生成好，减少句间停顿
                    prefetchNext(thisIndex + 1);
                });
                logDebug('播放完成');
            } catch (err) {
                console.error(err);
                ttsStatus.textContent = '出错：' + err.message;
                alert('朗读出错：' + err.message);
                stopReading();
                return;
            }
            readIndex++;
        }
        if (isReading && readIndex >= sentenceSpans.length) {
            ttsStatus.textContent = '本页朗读完毕';
            if (currentPage < pages.length - 1) {
                stopReadingKeepState();
                nextPage();
                startReading();
                return;
            }
            stopReading();
        }
    }

    // 预取缓存：index -> Promise<audioUrl>，避免重复请求同一句
    const prefetchCache = {};
    function prefetchNext(nextIndex) {
        if (nextIndex >= sentenceSpans.length) return;
        if (prefetchCache[nextIndex]) return;
        const nextSpan = sentenceSpans[nextIndex];
        if (!nextSpan) return;
        logDebug(`提前预取第 ${nextIndex + 1} 句音频`);
        prefetchCache[nextIndex] = synthesize(nextSpan.textContent).catch(err => {
            logDebug(`预取第 ${nextIndex + 1} 句失败（不影响主流程，届时会重试）：` + err.message);
            delete prefetchCache[nextIndex];
            return null;
        });
    }

    function highlightSentence(span) {
        document.querySelectorAll('.sentence.reading').forEach(s => s.classList.remove('reading'));
        span.classList.add('reading');
        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // 调用 MiniMax 同步 T2A 接口，返回可播放的音频 URL（blob URL）
    async function synthesize(text) {
        const apiKey = apiKeyInput.value.trim();
        const voiceId = getVoiceId();
        const speed = parseFloat(speedRange.value);

        const model = modelSelect.value;
        const vol = parseFloat(volInput.value) || 1;
        const pitch = parseInt(pitchInput.value, 10) || 0;
        const emotion = emotionSelect.value;
        const languageBoost = languageBoostSelect.value;
        const sampleRate = parseInt(sampleRateSelect.value, 10);
        const bitrate = parseInt(bitrateSelect.value, 10);
        const format = formatSelect.value;
        const channel = parseInt(channelSelect.value, 10);

        const voiceSetting = {
            voice_id: voiceId,
            speed: speed,
            vol: vol,
            pitch: pitch
        };
        if (emotion) voiceSetting.emotion = emotion;

        const proxyUrl = proxyUrlInput.value.trim();
        const targetUrl = proxyUrl || 'https://api.minimaxi.com/v1/t2a_v2';

        const resp = await fetch(targetUrl, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + apiKey,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: model,
                text: text,
                stream: false,
                language_boost: languageBoost,
                voice_setting: voiceSetting,
                audio_setting: {
                    sample_rate: sampleRate,
                    bitrate: bitrate,
                    format: format,
                    channel: channel
                }
            })
        }).catch(networkErr => {
            console.error('网络请求失败：', networkErr);
            throw new Error('请求被拦截（通常是 CORS 跨域限制）。请在"代理地址"里填入你部署的 Cloudflare Worker 地址后重试');
        });

        if (!resp.ok) {
            throw new Error('HTTP ' + resp.status);
        }
        const json = await resp.json();
        if (json.base_resp && json.base_resp.status_code !== 0) {
            throw new Error(json.base_resp.status_msg || '接口返回错误');
        }
        const hexAudio = json.data && json.data.audio;
        if (!hexAudio) {
            throw new Error('未返回音频数据');
        }
        const bytes = hexToBytes(hexAudio);
        const mimeMap = { mp3: 'audio/mpeg', wav: 'audio/wav', pcm: 'audio/pcm', flac: 'audio/flac' };
        const blob = new Blob([bytes], { type: mimeMap[format] || 'audio/mpeg' });
        return URL.createObjectURL(blob);
    }

    function resetAdvancedSettings() {
        modelSelect.value = 'speech-2.8-hd';
        volInput.value = 1;
        pitchInput.value = 0;
        emotionSelect.value = '';
        languageBoostSelect.value = 'auto';
        sampleRateSelect.value = '32000';
        bitrateSelect.value = '128000';
        formatSelect.value = 'mp3';
        channelSelect.value = '1';
        prefetchThresholdInput.value = 60;
        speedRange.value = 1;
        speedVal.textContent = '1.0';
        saveSettings();
    }

    function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes;
    }

    function playAudio(url, onProgressThreshold) {
        return new Promise((resolve, reject) => {
            if (!ttsAudioEl) ttsAudioEl = new Audio();
            currentAudio = ttsAudioEl;
            currentAudio.src = url;
            let firedProgress = false;
            currentAudio.ontimeupdate = () => {
                if (!firedProgress && onProgressThreshold && currentAudio.duration > 0) {
                    let threshold = parseFloat(prefetchThresholdInput.value);
                    if (isNaN(threshold) || threshold < 1 || threshold > 99) threshold = 60;
                    if (currentAudio.currentTime / currentAudio.duration >= threshold / 100) {
                        firedProgress = true;
                        onProgressThreshold();
                    }
                }
            };
            currentAudio.onended = () => {
                URL.revokeObjectURL(url);
                currentAudio.ontimeupdate = null;
                resolve();
            };
            currentAudio.onerror = () => {
                URL.revokeObjectURL(url);
                currentAudio.ontimeupdate = null;
                reject(new Error('音频播放失败'));
            };
            currentAudio.play().catch(reject);
        });
    }

    function togglePause() {
        if (!isReading) return;
        isPaused = !isPaused;
        ttsPauseBtn.textContent = isPaused ? '继续' : '暂停';
        if (currentAudio) {
            if (isPaused) currentAudio.pause();
            else currentAudio.play().catch(() => {});
        }
        ttsStatus.textContent = isPaused ? '已暂停' : '朗读中...';
        updateListenBtnUI();
    }

    function stopReading() {
        isReading = false;
        isPaused = false;
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
            currentAudio = null;
        }
        Object.keys(prefetchCache).forEach(key => {
            prefetchCache[key].then(url => { if (url) URL.revokeObjectURL(url); }).catch(() => {});
            delete prefetchCache[key];
        });
        document.querySelectorAll('.sentence.reading').forEach(s => s.classList.remove('reading'));
        ttsPlayBtn.disabled = false;
        ttsPauseBtn.disabled = true;
        ttsStopBtn.disabled = true;
        ttsStatus.textContent = '';
        updateListenBtnUI();
    }

    // 翻页续读时，只重置朗读状态但不清空 UI 提示，避免闪烁
    function stopReadingKeepState() {
        isReading = false;
        isPaused = false;
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
            currentAudio = null;
        }
        Object.keys(prefetchCache).forEach(key => {
            prefetchCache[key].then(url => { if (url) URL.revokeObjectURL(url); }).catch(() => {});
            delete prefetchCache[key];
        });
    }

    // ---- 页面加载完成后，恢复上次保存的参数配置 ----
    loadSettings();
    bindAutoSave();
</script>
</div>
</body>
</html>
