<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm 客户端音视频处理工作台</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rrems;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .status-bar {
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .drop-zone input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input[type="text"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.625rem;
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 1.5rem;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--bg-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
        }

        .preview-section {
            margin-top: 2rem;
            display: none;
            text-align: center;
        }

        video {
            width: 100%;
            max-height: 400px;
            border-radius: 6px;
            background-color: black;
            margin-top: 1rem;
        }

        .logs {
            margin-top: 1.5rem;
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: #64748b;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FFmpeg.wasm 纯前端音视频处理</h1>
        <p class="subtitle">无需上传服务器，所有编解码计算均在您的浏览器本地安全运行</p>

        <div class="status-bar" id="statusBar">
            <span id="statusText">正在初始化 FFmpeg 内核...</span>
            <span id="memoryMode">加载中</span>
        </div>

        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="video/*,audio/*">
            <p id="fileLabel">点击此处选择文件，或将视频/音频文件拖拽到这里</p>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <label for="presetAction">常用操作预设</label>
                <select id="presetAction">
                    <option value="transcode-mp4">转码为标准 MP4 (H.264 / AAC)</option>
                    <option value="extract-audio">提取音频为 MP3</option>
                    <option value="scale-725">调整分辨率至 720p</option>
                    <option value="custom">自定义 FFmpeg 参数</option>
                </select>
            </div>
            <div class="control-group">
                <label for="customArgs">FFmpeg 命令行参数</label>
                <input type="text" id="customArgs" value="-c:v libx264 -preset ultrafast" placeholder="例如: -c:v libx264">
            </div>
        </div>

        <button id="processBtn" class="btn" disabled>开始处理</button>

        <div class="progress-container" id="progressContainer">
            <div style="display: flex; justify-content: space-between; font-size: 0.875rem;">
                <span id="progressText">处理进度</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <div class="preview-section" id="previewSection">
            <h3 style="font-size: 1rem; text-align: left; margin-bottom: 0.5rem;">处理结果预览</h3>
            <video id="outputVideo" controls></video>
            <div style="margin-top: 1rem;">
                <a id="downloadBtn" class="btn" style="display: inline-block; text-decoration: none; line-height: normal;" download="output.mp4">下载处理后的文件</a>
            </div>
        </div>

        <div class="logs" id="logBox">系统日志输出区域...
</div>
    </div>

    <!-- ES Module 导入 FFmpeg.wasm v0.12 -->
    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        let ffmpeg = null;
        let selectedFile = null;

        const statusText = document.getElementById('statusText');
        const memoryMode = document.getElementById('memoryMode');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const processBtn = document.getElementById('processBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressPercent = document.getElementById('progressPercent');
        const progressBarFill = document.getElementById('progressBarFill');
        const previewSection = document.getElementById('previewSection');
        const outputVideo = document.getElementById('outputVideo');
        const downloadBtn = document.getElementById('downloadBtn');
        const logBox = document.getElementById('logBox');
        const presetAction = document.getElementById('presetAction');
        const customArgs = document.getElementById('customArgs');

        function appendLog(message) {
            logBox.textContent += message + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 检查 SharedArrayBuffer 支持情况以确认是否支持多线程
        if (window.SharedArrayBuffer) {
            memoryMode.textContent = "多线程模式 (SharedArrayBuffer)";
            memoryMode.style.color = "#10b981";
        } else {
            memoryMode.textContent = "单线程降级模式";
            memoryMode.style.color = "#f59e0b";
        }

        async function initFFmpeg() {
            try {
                ffmpeg = new FFmpeg();

                ffmpeg.on('log', ({ message }) => {
                    appendLog(message);
                });

                ffmpeg.on('progress', ({ progress, time }) => {
                    const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
                    progressPercent.textContent = `${percent}%`;
                    progressBarFill.style.width = `${percent}%`;
                });

                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                
                statusText.textContent = '正在下载 WebAssembly 核心组件...';
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });

                statusText.textContent = 'FFmpeg 内核已就绪，请选择文件';
            } catch (error) {
                statusText.textContent = 'FFmpeg 加载失败 (可能由于缺少跨域隔离响应头)';
                appendLog(`错误详情: ${error.message}`);
                console.error(error);
            }
        }

        initFFmpeg();

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileLabel.textContent = `已选择文件: ${selectedFile.name} (${(selectedFile.size / (1024*1024)).toFixed(2)} MB)`;
                processBtn.disabled = false;
            }
        });

        presetAction.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'transcode-mp4') {
                customArgs.value = '-c:v libx264 -preset ultrafist -c:a aac';
            } else if (val === 'extract-audio') {
                customArgs.value = '-vn -ab 192k';
            } else if (val === 'scale-725') {
                customArgs.value = '-vf scale=-2:720 -c:v libx264 -preset ultrafast';
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile || !ffmpeg) return;

            processBtn.disabled = true;
            progressContainer.style.display = 'block';
            previewSection.style.display = 'none';
            logBox.textContent = '--- 开始执行任务 ---\n';

            const inputName = 'input_file';
            let outputName = 'output.mp4';
            
            const preset = presetAction.value;
            if (preset === 'extract-audio') {
                outputName = 'output.mp3';
            }

            try {
                // 将文件写入内存虚拟文件系统
                statusText.textContent = '正在写入虚拟文件系统...';
                await ffmpeg.writeFile(inputName, new Uint8Array(await selectedFile.arrayBuffer()));

                // 组装命令行参数
                const argsArray = ['-i', inputName];
                const userArgs = customArgs.value.trim().split(/\s+/);
                argsArray.push(...userArgs);
                argsArray.push(outputName);

                statusText.textContent = '正在转码/处理中...';
                appendLog(`执行命令: ffmpeg ${argsArray.join(' ')}`);

                // 执行 FFmpeg 命令
                await ffmpeg.exec(argsArray);

                statusText.textContent = '处理完成，正在读取结果...';
                const data = await ffmpeg.readFile(outputName);

                let mimeType = 'video/mp4';
                if (outputName.endsWith('.mp3')) {
                    mimeType = 'audio/mpeg';
                }

                const blob = new Blob([data.buffer], { type: mimeType });
                const blobUrl = URL.createObjectURL(blob);

                if (mimeType.startsWith('video/')) {
                    outputVideo.src = blobUrl;
                    outputVideo.style.display = 'block';
                } else {
                    outputVideo.style.display = 'none';
                }

                downloadBtn.href = blobUrl;
                downloadBtn.download = outputName;
                previewSection.style.display = 'block';
                statusText.textContent = '全部处理已成功完成！';

            } catch (err) {
                statusText.textContent = '处理过程中发生错误';
                appendLog(`执行错误: ${err.message}`);
                console.error(err);
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
