<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>剪映间 · 视频编辑</title>
<style>
:root{
  --bg:#101014;--panel:#1a1a21;--panel2:#22222b;--line:#2e2e3a;
  --ink:#f2f0ec;--dim:#9b98a6;--acc:#ffc93c;--acc2:#4dd6c1;--danger:#ff5d73;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","SF Pro",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
header h1{font-size:17px;font-weight:700;letter-spacing:.06em}
header h1 em{color:var(--acc);font-style:normal}
#status{font-size:12px;color:var(--dim);max-width:55%;text-align:right}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 32px}

/* 上传 */
#drop{
  border:1.5px dashed var(--line);border-radius:var(--r);padding:44px 16px;
  text-align:center;color:var(--dim);font-size:14px;background:var(--panel);
}
#drop strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
#drop.hide{display:none}
input[type=file]{display:none}

/* 预览 */
#stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;display:none;touch-action:none}
#stage.show{display:block}
canvas#view{width:100%;display:block}
video{display:none}
#cropBox{position:absolute;z-index:3;border:1.5px solid var(--acc);box-shadow:0 0 0 9999px rgba(0,0,0,.55);display:none;touch-action:none}
#stage.cropping #playBtn{display:none!important}
#cropBox .h{position:absolute;width:26px;height:26px;right:-13px;bottom:-13px;background:var(--acc);border-radius:50%}
#playBtn{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:22px}

/* 时间轴 */
#timeline{display:none;margin-top:12px}
#timeline.show{display:block}
#thumbs{position:relative;height:56px;border-radius:10px;overflow:hidden;background:var(--panel2)}
#thumbs img{height:56px;float:left}
#selL,#selR{position:absolute;top:0;bottom:0;width:16px;background:var(--acc);touch-action:none;z-index:3}
#selMask{pointer-events:none}
#selL{border-radius:8px 0 0 8px}#selR{border-radius:0 8px 8px 0}
#selL::after,#selR::after{content:"";position:absolute;left:6px;top:18px;bottom:18px;width:3px;border-radius:2px;background:#00000055}
#selMask{position:absolute;top:0;bottom:0;border-top:2px solid var(--acc);border-bottom:2px solid var(--acc)}
#cursor{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:2}
#tlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}

/* 工具区 */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:2px}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:999px;font-size:13px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#151515;font-weight:600}
.panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel.on{display:block}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row input[type=range]{min-width:120px}
.row:last-child{margin-bottom:0}
.row label{width:64px;font-size:13px;color:var(--dim);flex:0 0 auto}
.row output{width:44px;text-align:right;font-size:12px;color:var(--acc2);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--acc)}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13px}
.chip.on{border-color:var(--acc2);color:var(--acc2)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font-size:14px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px;font-size:13px}

/* 底部动作 */
#actions{display:none;margin-top:14px;gap:10px}
#actions.show{display:flex}
#actions button{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600}
#btnShot{background:var(--panel2);color:var(--ink);border:1px solid var(--line)!important}
#btnExport{background:var(--acc);color:#151515}
#btnExport:disabled{opacity:.5}
#prog{display:none;margin-top:10px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--acc2)}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
a.dl{color:var(--acc2)}
button{cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<header><h1>剪映间<em>·</em>Studio</h1><div id="status">选择一个视频开始</div></header>

<label id="drop">
  <strong>点按选择视频</strong>支持 MP4 / MOV · 全程本地处理,不上传
  <input type="file" id="file" accept="video/*">
</label>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="cropBox"><div class="h"></div></div>
  <button id="playBtn">▶</button>
</div>
<video id="vid" playsinline webkit-playsinline muted></video>

<div id="timeline">
  <div id="thumbs"><div id="selMask"></div><div id="selL"></div><div id="selR"></div><div id="cursor"></div></div>
  <div id="tlabel"><span id="tIn">0:00.0</span><span id="tDur"></span><span id="tOut">0:00.0</span></div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button data-p="pAdj" class="on">调色</button>
  <button data-p="pFx">滤镜</button>
  <button data-p="pCrop">裁切/旋转</button>
  <button data-p="pSpeed">速度/音量</button>
  <button data-p="pText">文字</button>
</div>

<div class="panel on" id="pAdj">
  <div class="row"><label>亮度</label><input type="range" id="bri" min="50" max="150" value="100"><output>100</output></div>
  <div class="row"><label>对比度</label><input type="range" id="con" min="50" max="150" value="100"><output>100</output></div>
  <div class="row"><label>饱和度</label><input type="range" id="sat" min="0" max="200" value="100"><output>100</output></div>
  <div class="row"><label>色相</label><input type="range" id="hue" min="0" max="360" value="0"><output>0</output></div>
  <div class="row"><label>模糊</label><input type="range" id="blur" min="0" max="10" value="0"><output>0</output></div>
  <div class="row"><label></label><button class="chip" id="resetAdj">重置调色</button></div>
</div>

<div class="panel" id="pFx"><div class="grid" id="fxGrid"></div></div>

<div class="panel" id="pCrop">
  <div class="grid" style="margin-bottom:12px">
    <button class="chip" id="rotBtn">旋转 90°</button>
    <button class="chip" id="flipH">水平翻转</button>
    <button class="chip" id="flipV">垂直翻转</button>
    <button class="chip" id="cropToggle">框选裁切</button>
    <button class="chip" id="cropClear">取消裁切</button>
  </div>
  <div class="note">开启「框选裁切」后,拖动黄框移动位置、拖右下角圆点调整大小。</div>
</div>

<div class="panel" id="pSpeed">
  <div class="row"><label>倍速</label><input type="range" id="speed" min="25" max="300" value="100" step="5"><output>1.0x</output></div>
  <div class="row"><label>音量</label><input type="range" id="vol" min="0" max="100" value="100"><output>100</output></div>
  <div class="row"><label></label><button class="chip" id="muteBtn">静音</button></div>
  <div class="note">导出时会保留倍速;导出含声音需 iOS 上允许音频(先点播放一次)。</div>
</div>

<div class="panel" id="pText">
  <div class="row"><input type="text" id="txt" placeholder="输入水印 / 字幕文字"></div>
  <div class="row"><label>大小</label><input type="range" id="txtSize" min="12" max="120" value="36"><output>36</output></div>
  <div class="row"><label>位置</label>
    <select id="txtPos">
      <option value="bottom">底部居中</option><option value="top">顶部居中</option>
      <option value="center">正中</option><option value="tl">左上</option><option value="br">右下</option>
    </select>
    <label style="width:auto">颜色</label><input type="color" id="txtColor" value="#ffffff" style="width:44px;height:36px;border:none;background:none">
  </div>
</div>

<div id="actions">
  <button id="btnShot">截取当前帧</button>
  <button id="btnExport">导出视频</button>
</div>
<div id="prog"><i></i></div>
<div class="note" id="outNote"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const vid=$("#vid"),view=$("#view"),ctx=view.getContext("2d");
const status=$("#status");
let dur=0,tIn=0,tOut=0,playing=false,rot=0,fh=1,fv=1,crop=null,cropMode=false;
const adj={bri:100,con:100,sat:100,hue:0,blur:0,fx:""};
const FX=[["原片",""],["黑白","grayscale(1)"],["复古","sepia(.7) saturate(1.2)"],["胶片","contrast(1.15) saturate(1.3) sepia(.15)"],["冷调","hue-rotate(180deg) saturate(.85)"],["暖阳","sepia(.3) saturate(1.4) brightness(1.05)"],["反色","invert(1)"],["梦幻","blur(1px) brightness(1.1) saturate(1.3)"]];

const fmt=t=>{const m=~~(t/60),s=(t%60).toFixed(1);return m+":"+(s<10?"0":"")+s};

// ---- 加载 ----
$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  vid.src=URL.createObjectURL(f);
  vid.load();
  status.textContent="解析中…";
});
vid.addEventListener("loadedmetadata",async()=>{
  dur=vid.duration;tIn=0;tOut=dur;
  $("#drop").classList.add("hide");
  $("#stage").classList.add("show");
  $("#timeline").classList.add("show");
  $("#tabs").style.display="flex";
  $("#actions").classList.add("show");
  $("#tDur").textContent="全长 "+fmt(dur);
  sizeCanvas();updateSel();
  status.textContent=vid.videoWidth+"×"+vid.videoHeight+" · "+fmt(dur);
  await buildThumbs();
  vid.currentTime=0.01;
});
vid.addEventListener("seeked",draw);
window.addEventListener("resize",()=>{sizeCanvas();draw();updateSel()});

function outSize(){
  const w=crop?crop.w:vid.videoWidth,h=crop?crop.h:vid.videoHeight;
  return (rot%180)?[h,w]:[w,h];
}
function sizeCanvas(){
  const [w,h]=outSize();if(!w)return;
  const cw=$("#stage").clientWidth||view.parentElement.clientWidth||360;
  view.width=w;view.height=h;
  view.style.height=(cw*h/w)+"px";
}

// ---- 绘制 ----
function draw(){
  if(!vid.videoWidth)return;
  const [w,h]=outSize();
  if(view.width!==w||view.height!==h)sizeCanvas();
  ctx.save();
  ctx.filter=`brightness(${adj.bri}%) contrast(${adj.con}%) saturate(${adj.sat}%) hue-rotate(${adj.hue}deg) blur(${adj.blur}px) ${adj.fx}`.trim();
  ctx.translate(w/2,h/2);
  ctx.rotate(rot*Math.PI/180);
  ctx.scale(fh,fv);
  const sw=crop?crop.w:vid.videoWidth,sh=crop?crop.h:vid.videoHeight;
  const sx=crop?crop.x:0,sy=crop?crop.y:0;
  ctx.drawImage(vid,sx,sy,sw,sh,-sw/2,-sh/2,sw,sh);
  ctx.restore();
  drawText(ctx,w,h,1);
  drawCursor();
}
function drawText(c,w,h,scale){
  const t=$("#txt").value;if(!t)return;
  const size=+$("#txtSize").value*scale;
  c.save();c.filter="none";
  c.font=`600 ${size}px -apple-system,'PingFang SC',sans-serif`;
  c.fillStyle=$("#txtColor").value;
  c.strokeStyle="rgba(0,0,0,.55)";c.lineWidth=size/12;
  c.textAlign="center";c.textBaseline="middle";
  let x=w/2,y=h-size;
  const pos=$("#txtPos").value;
  if(pos==="top")y=size;else if(pos==="center")y=h/2;
  else if(pos==="tl"){c.textAlign="left";x=size/2;y=size}
  else if(pos==="br"){c.textAlign="right";x=w-size/2;y=h-size}
  c.strokeText(t,x,y);c.fillText(t,x,y);
  c.restore();
}

// ---- 播放循环 ----
$("#playBtn").addEventListener("click",async()=>{
  if(playing){vid.pause();return}
  vid.muted=false;
  if(vid.currentTime<tIn||vid.currentTime>=tOut)vid.currentTime=tIn;
  try{await vid.play()}catch(e){vid.muted=true;vid.play()}
});
vid.addEventListener("play",()=>{playing=true;$("#playBtn").style.display="none";loop()});
vid.addEventListener("pause",()=>{playing=false;$("#playBtn").style.display="block"});
function loop(){
  if(!playing)return;
  if(vid.currentTime>=tOut){vid.pause();vid.currentTime=tIn;return}
  draw();requestAnimationFrame(loop);
}

// ---- 缩略图 ----
async function buildThumbs(){
  const box=$("#thumbs");
  box.querySelectorAll("img").forEach(i=>i.remove());
  const n=Math.min(10,Math.max(5,~~(box.clientWidth/60)));
  const c=document.createElement("canvas");
  const th=56,tw=~~(th*vid.videoWidth/vid.videoHeight);
  c.width=tw;c.height=th;const cc=c.getContext("2d");
  const old=vid.currentTime;
  for(let i=0;i<n;i++){
    await seekTo(dur*(i+.5)/n);
    cc.drawImage(vid,0,0,tw,th);
    const img=new Image();img.src=c.toDataURL("image/jpeg",.5);
    img.style.width=(box.clientWidth/n)+"px";
    box.insertBefore(img,$("#selMask"));
  }
  vid.currentTime=old;
}
const seekTo=t=>new Promise(r=>{const f=()=>{vid.removeEventListener("seeked",f);r()};vid.addEventListener("seeked",f);vid.currentTime=t});

// ---- 时间轴拖拽(裁剪时长) ----
function updateSel(){
  const W=$("#thumbs").clientWidth;
  const l=tIn/dur*W,r=tOut/dur*W;
  $("#selL").style.left=Math.max(0,l-16)+"px";
  $("#selR").style.left=Math.min(W-16,r)+"px";
  $("#selMask").style.left=l+"px";$("#selMask").style.width=(r-l)+"px";
  $("#tIn").textContent=fmt(tIn);$("#tOut").textContent=fmt(tOut);
}
function drawCursor(){
  const W=$("#thumbs").clientWidth;
  $("#cursor").style.left=(vid.currentTime/dur*W)+"px";
}
function dragHandle(el,isLeft){
  el.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();el.setPointerCapture(e.pointerId);
    const move=ev=>{
      const rect=$("#thumbs").getBoundingClientRect();
      let t=(ev.clientX-rect.left)/rect.width*dur;
      t=Math.max(0,Math.min(dur,t));
      if(isLeft)tIn=Math.min(t,tOut-.2);else tOut=Math.max(t,tIn+.2);
      vid.currentTime=isLeft?tIn:tOut;
      updateSel();
    };
    const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up)};
    el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);
  });
}
dragHandle($("#selL"),true);dragHandle($("#selR"),false);
$("#thumbs").addEventListener("click",e=>{
  if(e.target.id==="selL"||e.target.id==="selR")return;
  const r=$("#thumbs").getBoundingClientRect();
  vid.currentTime=Math.max(tIn,Math.min(tOut,(e.clientX-r.left)/r.width*dur));
});

// ---- 调色 ----
["bri","con","sat","hue","blur"].forEach(k=>{
  const el=$("#"+k);
  el.addEventListener("input",()=>{adj[k]=+el.value;el.nextElementSibling.value=el.value;draw()});
});
$("#resetAdj").addEventListener("click",()=>{
  Object.assign(adj,{bri:100,con:100,sat:100,hue:0,blur:0});
  ["bri","con","sat"].forEach(k=>{$("#"+k).value=100;$("#"+k).nextElementSibling.value=100});
  ["hue","blur"].forEach(k=>{$("#"+k).value=0;$("#"+k).nextElementSibling.value=0});
  draw();
});

// ---- 滤镜 ----
FX.forEach(([name,f],i)=>{
  const b=document.createElement("button");
  b.className="chip"+(i===0?" on":"");b.textContent=name;
  b.addEventListener("click",()=>{
    adj.fx=f;
    $("#fxGrid").querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");draw();
  });
  $("#fxGrid").appendChild(b);
});

// ---- 旋转/翻转/裁切 ----
$("#rotBtn").addEventListener("click",()=>{rot=(rot+90)%360;sizeCanvas();draw()});
$("#flipH").addEventListener("click",e=>{fh*=-1;e.target.classList.toggle("on");draw()});
$("#flipV").addEventListener("click",e=>{fv*=-1;e.target.classList.toggle("on");draw()});
$("#cropClear").addEventListener("click",()=>{crop=null;cropMode=false;$("#cropBox").style.display="none";$("#stage").classList.remove("cropping");$("#cropToggle").classList.remove("on");sizeCanvas();draw()});
$("#cropToggle").addEventListener("click",e=>{
  cropMode=!cropMode;e.target.classList.toggle("on",cropMode);
  const box=$("#cropBox");
  $("#stage").classList.toggle("cropping",cropMode);
  if(cropMode){
    if(playing)vid.pause();
    crop=null;sizeCanvas();draw();
    const W=$("#stage").clientWidth,H=view.getBoundingClientRect().height;
    box.style.display="block";
    box.style.left=W*.15+"px";box.style.top=H*.15+"px";
    box.style.width=W*.7+"px";box.style.height=H*.7+"px";
  }else{applyCrop()}
});
function applyCrop(){
  $("#stage").classList.remove("cropping");
  const box=$("#cropBox"),sr=view.getBoundingClientRect(),br=box.getBoundingClientRect();
  const kx=vid.videoWidth/sr.width,ky=vid.videoHeight/sr.height;
  crop={x:Math.max(0,(br.left-sr.left)*kx),y:Math.max(0,(br.top-sr.top)*ky),
        w:Math.min(vid.videoWidth,br.width*kx),h:Math.min(vid.videoHeight,br.height*ky)};
  crop.w=Math.min(crop.w,vid.videoWidth-crop.x);crop.h=Math.min(crop.h,vid.videoHeight-crop.y);
  box.style.display="none";sizeCanvas();draw();
}
(function(){
  const box=$("#cropBox"),h=box.querySelector(".h");
  let mode=null,sx,sy,ox,oy,ow,oh;
  box.addEventListener("pointerdown",e=>{
    e.preventDefault();box.setPointerCapture(e.pointerId);
    mode=(e.target===h)?"size":"move";
    sx=e.clientX;sy=e.clientY;
    ox=box.offsetLeft;oy=box.offsetTop;ow=box.offsetWidth;oh=box.offsetHeight;
  });
  box.addEventListener("pointermove",e=>{
    if(!mode)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    const W=$("#stage").clientWidth,H=view.getBoundingClientRect().height;
    if(mode==="move"){
      box.style.left=Math.max(0,Math.min(W-box.offsetWidth,ox+dx))+"px";
      box.style.top=Math.max(0,Math.min(H-box.offsetHeight,oy+dy))+"px";
    }else{
      box.style.width=Math.max(40,Math.min(W-box.offsetLeft,ow+dx))+"px";
      box.style.height=Math.max(40,Math.min(H-box.offsetTop,oh+dy))+"px";
    }
  });
  box.addEventListener("pointerup",()=>mode=null);
})();

// ---- 速度/音量 ----
$("#speed").addEventListener("input",e=>{
  vid.playbackRate=e.target.value/100;
  e.target.nextElementSibling.value=(e.target.value/100).toFixed(2)+"x";
});
$("#vol").addEventListener("input",e=>{vid.volume=e.target.value/100;e.target.nextElementSibling.value=e.target.value});
$("#muteBtn").addEventListener("click",e=>{vid.muted=!vid.muted;e.target.classList.toggle("on",vid.muted)});

// ---- 文字实时预览 ----
["txt","txtSize","txtPos","txtColor"].forEach(id=>$("#"+id).addEventListener("input",()=>{
  const o=$("#txtSize").nextElementSibling;if(o)o.value=$("#txtSize").value;draw();
}));

// ---- Tabs ----
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===b.dataset.p));
});

// ---- 截帧 ----
$("#btnShot").addEventListener("click",()=>{
  draw();
  view.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="frame-"+Date.now()+".png";a.click();
    note("已保存当前帧为 PNG。iOS 会打开分享/下载面板。");
  },"image/png");
});

// ---- 导出 ----
function pickMime(){
  const list=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  for(const m of list)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return null;
}
$("#btnExport").addEventListener("click",async()=>{
  if(!("MediaRecorder" in window)){note("此浏览器不支持视频录制导出(iOS 需 14.5+ 的 Safari)。你仍可使用截帧功能。");return}
  if(!view.captureStream){note("此浏览器不支持画布录制(canvas.captureStream)。请更新 iOS/Safari 后重试。");return}
  const mime=pickMime();
  const btn=$("#btnExport");btn.disabled=true;btn.textContent="导出中…";
  $("#prog").style.display="block";
  const bar=$("#prog i");
  vid.pause();
  const rate=+$("#speed").value/100;
  const stream=view.captureStream(30);
  // 混入音频(失败则导出无声,不中断)
  let ac=null;
  try{
    if(!vid.muted && vid.volume>0){
      ac=window.__ac || new (window.AudioContext||window.webkitAudioContext)();
      window.__ac=ac; // MediaElementSource 只能创建一次
      await ac.resume();
      if(!window.__src){
        window.__src=ac.createMediaElementSource(vid);
        window.__gain=ac.createGain();
        window.__dest=ac.createMediaStreamDestination();
        window.__src.connect(window.__gain);
        window.__gain.connect(window.__dest);
        window.__gain.connect(ac.destination);
      }
      window.__gain.gain.value=vid.volume;
      window.__dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    }
  }catch(e){}
  // 创建录制器:逐级降级,避免 iOS 对参数/编码不支持
  let rec=null;
  const tries=[];
  if(mime)tries.push({mimeType:mime,videoBitsPerSecond:6e6},{mimeType:mime});
  tries.push({videoBitsPerSecond:6e6},{});
  for(const opt of tries){try{rec=new MediaRecorder(stream,opt);break}catch(e){}}
  if(!rec){note("无法创建录制器,此设备暂不支持导出。");btn.disabled=false;btn.textContent="导出视频";$("#prog").style.display="none";return}
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);
  vid.currentTime=tIn;await seekTo(tIn);
  vid.playbackRate=rate;
  rec.start(); // iOS 的 MP4 录制不能用 timeslice,否则文件损坏
  try{await vid.play()}catch(e){vid.muted=true;try{await vid.play()}catch(e2){}}
  await new Promise(res=>{
    const tick=()=>{
      draw();
      bar.style.width=Math.min(100,(vid.currentTime-tIn)/(tOut-tIn)*100)+"%";
      if(vid.currentTime>=tOut||vid.ended){res()}else requestAnimationFrame(tick);
    };tick();
  });
  vid.pause();
  try{rec.requestData()}catch(e){}
  rec.stop();await done;
  const outType=(rec.mimeType&&rec.mimeType.split(";")[0])||(mime?mime.split(";")[0]:"video/mp4");
  const ext=outType.includes("mp4")?"mp4":(outType.includes("webm")?"webm":"mov");
  const blob=new Blob(chunks,{type:outType});
  if(!blob.size){note("导出失败:未录到数据。请确认视频已能正常播放后重试。");btn.disabled=false;btn.textContent="导出视频";$("#prog").style.display="none";return}
  const url=URL.createObjectURL(blob);
  // iOS 上程序化下载常被拦截:提供需要用户点按的保存按钮(点按属于用户手势)
  note(`导出完成(${ext.toUpperCase()},${(blob.size/1048576).toFixed(1)} MB)。
    <a class="dl" style="display:inline-block;margin-top:6px;background:var(--acc2);color:#111;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600"
       href="${url}" download="export-${Date.now()}.${ext}">点此保存视频</a><br>
    iOS:点按后在分享面板选择「存储到文件」,或长按链接选「下载链接的文件」;之后可从文件 App 存入相册。`);
  bar.style.width="0";$("#prog").style.display="none";
  btn.disabled=false;btn.textContent="导出视频";
});
function note(html){$("#outNote").innerHTML=html}
</script>
</body>
</html>
