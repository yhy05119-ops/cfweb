<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MiniMax TTS 播放器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>MiniMax 语音合成测试</h2>
    <textarea id="textInput">今天是不是很开心呀(laughs)，当然了！</textarea>
    <button onclick="generateAudio()">生成并播放音频</button>
    <audio id="audioPlayer" controls style="display:block; margin-top: 20px;"></audio>

    <script>
        // 核心函数：处理 Hex 转 Blob 并播放
        function hexToBlob(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
            }
            return new Blob([bytes], { type: 'audio/mpeg' });
        }

        async function generateAudio() {
            const text = document.getElementById('textInput').value;
            const player = document.getElementById('audioPlayer');

            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer sk-cp-9p9ImZG_33-dnQY8II1RB1DZOhoRV0qaDYoo0VUhnW4xa7TNM5AoF3N_IEGRkjX0Zdc68DbBFzuXrOtl9jGJp-5B21VhLyl0RrMErZFbt9TgomWxjz3YDcY' // 在此填入你的 Key
                },
                body: JSON.stringify({
                    model: 'speech-2.8-hd',
                    text: text,
                    stream: false,
                    voice_setting: {voice_id: 'male-qn-qingse', speed: 1, vol: 1, pitch: 0, emotion: 'happy'},
                    audio_setting: {sample_rate: 32000, bitrate: 128000, format: 'mp3', channel: 1}
                })
            };

            try {
                const res = await fetch('https://api.minimaxi.com/v1/t2a_v2', options);
                const data = await res.json();
                
                if (data.audio) {
                    const blob = hexToBlob(data.audio);
                    player.src = URL.createObjectURL(blob);
                    player.play();
                } else {
                    alert('获取音频失败：' + JSON.stringify(data));
                }
            } catch (err) {
                console.error(err);
                alert('请求出错，请检查控制台。');
            }
        }
    </script>
</body>
</html>
