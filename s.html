<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 自定义URL视频保存</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
        }
        button:active {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #9ac2ff;
            cursor: not-allowed;
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            background: #000;
            margin: 15px 0;
        }
        .action-box {
            margin-top: 15px;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>iOS 自定义视频保存工具</h2>

    <!-- 自定义 URL 输入区 -->
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="请输入或粘贴视频直链 (.mp4)..." value="https://www.w3schools.com/html/mov_bbb.mp4">
        <button id="loadBtn">加载视频</button>
    </div>
    
    <!-- 视频播放区域 -->
    <div>
        <video id="videoPlayer" controls playsinline crossorigin="anonymous">
            您的浏览器不支持视频标签
        </video>
    </div>

    <!-- 保存操作区 -->
    <div class="action-box">
        <button id="downloadBtn" disabled>保存视频到本地</button>
    </div>
    
    <div id="status">请输入视频链接并点击加载</div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const loadBtn = document.getElementById('loadBtn');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');

        // 1. 加载并播放自定义 URL
        loadBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) {
                alert('请输入有效的视频 URL');
                return;
            }
            
            statusDiv.textContent = "正在加载视频...";
            videoPlayer.src = url;
            videoPlayer.load();
            
            videoPlayer.onloadeddata = () => {
                statusDiv.textContent = "视频加载成功，可以点击下方按钮保存。";
                downloadBtn.disabled = false;
            };

            videoPlayer.onerror = () => {
                statusDiv.textContent = "视频加载失败，请检查链接是否正确或是否存在跨域(CORS)限制。";
                downloadBtn.disabled = true;
            };
        });

        // 页面刚打开时自动触发一次加载默认视频
        window.addEventListener('DOMContentLoaded', () => {
            loadBtn.click();
        });

        // 2. 点击保存视频
        downloadBtn.addEventListener('click', async () => {
            const currentUrl = videoPlayer.src;
            if (!currentUrl) return;

            statusDiv.textContent = "正在下载视频数据，请稍候...";
            downloadBtn.disabled = true;

            try {
                // 使用 fetch 获取视频流
                const response = await fetch(currentUrl);
                if (!response.ok) throw new Error('网络请求失败，状态码: ' + response.status);
                
                const blob = await response.blob();
                statusDiv.textContent = "视频下载完成，正在处理...";

                // 优先尝试 iOS 原生分享面板（可直接存入相册/文件）
                if (navigator.canShare && navigator.canShare({ files: [new File([blob], "video.mp4", { type: "video/mp4" })] })) {
                    try {
                        const file = new File([blob], "video_" + Date.now() + ".mp4", { type: "video/mp4" });
                        await navigator.share({
                            files: [file],
                            title: '保存视频',
                            text: '请选择存储位置'
                        });
                        statusDiv.textContent = "已调起系统分享面板";
                        downloadBtn.disabled = false;
                        return;
                    } catch (shareError) {
                        console.log('用户取消分享或分享失败，转为常规下载通道', shareError);
                    }
                }

                // 兜底：Base64 转换下载
                const reader = new FileReader();
                reader.onloadend = function() {
                    const base64data = reader.result;
                    const a = document.createElement('a');
                    a.href = base64data;
                    a.download = 'video_' + Date.now() + '.mp4';
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        statusDiv.textContent = "已触发下载，请留意浏览器的下载提示。";
                        downloadBtn.disabled = false;
                    }, 1000);
                };
                
                reader.onerror = () => {
                    throw new Error('文件转换失败');
                };

                reader.readAsDataURL(blob);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "保存失败: " + error.message + "（常见原因：目标视频服务器未开启跨域 CORS 访问）";
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
