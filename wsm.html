<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MiniMax 语音合成演示</title>
</head>
<body>
    <h1>MiniMax 同步语音合成演示</h1>
    <textarea id="textInput" rows="4" cols="50">你好，这是 MiniMax 语音合成测试。</textarea><br>
    <button onclick="startSynthesis()">开始合成</button>
    <button onclick="finishSynthesis()">结束任务</button>
    <div id="status">状态: 未连接</div>

    <script>
        let ws;
        const API_KEY = "sk-cp-qAfdjyJvm2BqCRt99Qunx1VqEsisxi2Ya95c8t5yXHXhXO3fSQIJXmXfLDjaBZ5fpmRW8h4IJosIhc8-l7ry3BanOXiX1-nYfFQlmZ0-0OFL0A3HDTex-w8"; // 请替换为您的 API Key
        const GROUP_ID = "2074383006025396517";   // 请替换为您的 Group ID
        const WS_URL = `wss://api.minimax.com/ws/v1/t2a_v2?GroupId=${GROUP_ID}`;

        function startSynthesis() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                document.getElementById('status').innerText = "状态: 已连接，正在发送启动指令...";
                
                // 发送 task_start
                const startMsg = {
                    "event": "task_start",
                    "model": "speech-2.8-turbo",
                    "voice_setting": { "voice_id": "moss_audio_ce44fc67-7ce3-11f0-8de5-96e35d26fb85" },
                    "audio_setting": { "format": "mp3" }
                };
                ws.send(JSON.stringify(startMsg));
            };

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);
                console.log("收到事件:", response.event);

                if (response.event === "task_started") {
                    document.getElementById('status').innerText = "状态: 任务已启动，正在发送文本...";
                    // 发送文本
                    const text = document.getElementById('textInput').value;
                    ws.send(JSON.stringify({ "event": "task_continue", "text": text }));
                } else if (response.event === "task_continued") {
                    if (response.data && response.data.audio) {
                        console.log("接收到音频分片");
                        // 在此处处理 Hex 编码的音频数据（通常需要转换为 Blob 后通过 AudioContext 播放）
                    }
                }
            };
        }

        function finishSynthesis() {
            if (ws) {
                ws.send(JSON.stringify({ "event": "task_finish" }));
                document.getElementById('status').innerText = "状态: 任务结束";
            }
        }
    </script>
</body>
</html>
