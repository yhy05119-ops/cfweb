<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二进制转十进制 - 单文件工具（支持大数）</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --text: #212529;
      --input: #fff;
      --border: #ced4da;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --input: #1e1e1e;
      --border: #444;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: all 0.4s;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { text-align: center; }
    textarea, input {
      width: 100%;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input);
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      margin: 10px 0;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      min-height: 1.5em;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #444;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">暗色/亮色</button>

  <div class="container">
    <h1>二进制 → 十进制（支持大数）</h1>
    <textarea id="binInput" rows="4" placeholder="在这里输入二进制（只允许0和1）&#10;例如：1000000000000000000000000000000000000000000000000000000000001"></textarea>
    <button onclick="convert()">转换</button>
    <div id="result"></div>
  </div>

  <script>
    function convert() {
      const input = document.getElementById('binInput').value.trim();
      const resultEl = document.getElementById('result');
      
      if (!/^[01]+$/.test(input)) {
        resultEl.innerHTML = "❌ 请输入正确的二进制数（只包含 0 和 1）";
        return;
      }
      
      try {
        // 用 BigInt 处理大整数
        const decimal = BigInt('0b' + input);
        resultEl.innerHTML = `${input}<sub>₂</sub> = <span style="color:#0d6efd">${decimal}</span><sub>₁₀</sub>`;
      } catch(e) {
        resultEl.innerHTML = "❌ 转换失败（数字可能过大或浏览器不支持BigInt）";
      }
    }

    function toggleTheme() {
      document.documentElement.dataset.theme = 
        document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    }
  </script>
</body>
</html>
