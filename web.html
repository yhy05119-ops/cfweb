<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>μWS 聊天室</title>
<style>
  /* ============ 设计令牌:浅色"仪表盘"风格 ============ */
  :root {
    --paper: #edf0f4;      /* 页面底色 */
    --card: #ffffff;       /* 卡片 / 对方气泡 */
    --ink: #18222d;        /* 正文 / 我的气泡 */
    --ink-2: #3d4a58;
    --muted: #75818f;
    --line: #d9dee6;
    --accent: #2447d6;     /* 钴蓝主按钮 */
    --accent-press: #1d3ab0;
    --ok: #159c62;
    --warn: #d99114;
    --err: #d64949;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  [hidden] { display: none !important; }

  .wordmark { font-family: var(--mono); font-weight: 700; letter-spacing: -0.5px; }
  .wordmark .mu { color: var(--accent); }

  /* 连接端点指示条:LED + ws:// 地址 */
  .endpoint {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; max-width: 100%;
  }
  .endpoint .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--err); flex: none; }
  .led.ok { background: var(--ok); }
  .led.warn { background: var(--warn); animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.25; } }

  /* ============ 进入页 ============ */
  .join { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .join-card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 34px 30px; box-shadow: 0 12px 32px rgba(24, 34, 45, 0.08);
  }
  .join-card .wordmark { font-size: 30px; }
  .join-card p { margin: 6px 0 20px; font-size: 13px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.3px; margin-top: 10px; }
  .field .lbl:first-child { margin-top: 0; }
  .field .primary { margin-top: 14px; }
  .url-input { font-family: var(--mono); }
  .form-err { font-size: 12px; color: var(--err); }
  input {
    font-size: 16px; /* ≥16px,避免 iOS 聚焦时自动放大 */
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); color: var(--ink); outline: none; width: 100%;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 71, 214, 0.15); }
  .primary {
    font-size: 15px; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-family: inherit;
  }
  .primary:hover { background: var(--accent-press); }
  .primary:active { transform: translateY(1px); }
  .primary:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ============ 聊天页 ============ */
  .app { height: 100dvh; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); }
  @media (min-width: 780px) {
    .app {
      height: calc(100dvh - 48px); margin: 24px auto;
      border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      box-shadow: 0 16px 48px rgba(24, 34, 45, 0.10);
    }
  }
  .bar {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .bar .wordmark { font-size: 17px; flex: none; }
  .bar .endpoint { margin-left: auto; min-width: 0; }
  .online { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; flex: none; }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 4px; animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
  .msg .bubble {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 13px; font-size: 15px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: var(--ink); border-color: var(--ink); color: #f2f5f8; }

  /* 系统事件按"日志行"渲染 */
  .sys { align-self: center; font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: center; padding: 0 8px; }
  .sys::before { content: "— "; }
  .sys::after { content: " —"; }

  .composer {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line);
  }
  .composer input { flex: 1; }
  .composer .primary { flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .led.warn { animation: none; }
    .msg { animation: none; }
  }
</style>
</head>
<body>

  <!-- 进入页 -->
  <section class="join" id="joinView">
    <div class="join-card">
      <div class="wordmark"><span class="mu">μ</span>WS 聊天室</div>
      <p>uWebSockets.js v20.67.0 · 前后端分离示例</p>
      <div class="field">
        <label class="lbl" for="wsInput">服务器地址</label>
        <input id="wsInput" class="url-input" placeholder="ws://104.244.92.127:9001/chat" autocomplete="off" spellcheck="false" />
        <div class="form-err" id="wsErr" hidden>地址需以 ws:// 或 wss:// 开头,例如 ws://192.168.1.5:9001/chat</div>
        <label class="lbl" for="nameInput">昵称</label>
        <input id="nameInput" placeholder="输入昵称" maxlength="20" autocomplete="off" />
        <button class="primary" id="joinBtn">进入聊天室</button>
      </div>
    </div>
  </section>

  <!-- 聊天页 -->
  <section class="app" id="chatView" hidden>
    <header class="bar">
      <div class="wordmark"><span class="mu">μ</span>WS</div>
      <div class="endpoint"><span class="led" id="led"></span><span class="url js-url"></span></div>
      <div class="online" id="online">—</div>
    </header>
    <main class="messages" id="messages" aria-live="polite"></main>
    <footer class="composer">
      <input id="msgInput" placeholder="输入消息…" maxlength="500" autocomplete="off" />
      <button class="primary" id="sendBtn">发送</button>
    </footer>
  </section>

<script>
(() => {
  // 默认地址:与页面同主机(file:// 打开时回退 localhost);https 页面下自动用 wss
  const DEFAULT_WS_URL =
    `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.hostname || 'localhost'}:9001/chat`;
  // 也支持 index.html?ws=wss://example.com/chat 直接指定,便于收藏/分享
  const PARAM_WS = new URLSearchParams(location.search).get('ws');

  let wsUrlBase = ''; // 点击"进入聊天室"时根据输入框确定

  const $ = (s) => document.querySelector(s);
  const joinView = $('#joinView'), chatView = $('#chatView');
  const nameInput = $('#nameInput'), joinBtn = $('#joinBtn');
  const list = $('#messages'), input = $('#msgInput'), sendBtn = $('#sendBtn');
  const led = $('#led'), onlineEl = $('#online');
  const wsInput = $('#wsInput'), wsErr = $('#wsErr');

  wsInput.value = PARAM_WS || DEFAULT_WS_URL;

  let ws = null;
  let myId = null;   // 服务端在 welcome 里下发的连接 id,用于区分"我发的消息"
  let myName = '';
  let retries = 0;

  function setStatus(state) {
    led.className = 'led ' + (state === 'online' ? 'ok' : state === 'connecting' ? 'warn' : '');
    if (state !== 'online') onlineEl.textContent = state === 'connecting' ? '连接中' : '重连中';
  }

  const fmtTime = (t) =>
    new Date(t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  function scrollBottom() { list.scrollTop = list.scrollHeight; }

  // 所有用户内容一律走 textContent,天然防 XSS
  function addSystem(text) {
    const div = document.createElement('div');
    div.className = 'sys';
    div.textContent = text;
    list.appendChild(div);
    scrollBottom();
  }

  function addChat({ id, name, text, time }) {
    const mine = id === myId;
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (mine ? ' mine' : '');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (mine ? '我' : name) + ' · ' + fmtTime(time);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.append(meta, bubble);
    list.appendChild(wrap);
    scrollBottom();
  }

  function connect() {
    setStatus('connecting');
    const u = new URL(wsUrlBase);
    u.searchParams.set('name', myName); // 用 URL API 拼参数,自定义地址自带 query 也不会拼错
    ws = new WebSocket(u.toString());

    ws.onopen = () => { retries = 0; setStatus('online'); };

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }

      if (typeof data.online === 'number') onlineEl.textContent = `在线 ${data.online}`;

      if (data.type === 'welcome') { myId = data.id; addSystem(`已连接,欢迎 ${data.name}`); }
      else if (data.type === 'system') addSystem(data.text);
      else if (data.type === 'chat') addChat(data);
    };

    // 断线自动重连:指数退避,上限 10 秒
    ws.onclose = () => {
      setStatus('offline');
      const delay = Math.min(1000 * 2 ** retries++, 10000);
      setTimeout(connect, delay);
    };
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ text })); // 不本地回显,以服务端广播回包为准
    input.value = '';
    input.focus();
  }

  // 校验并规范化地址:允许省略协议(自动补 ws://),仅接受 ws: / wss:
  function normalizeWsUrl(raw) {
    let s = raw.trim() || DEFAULT_WS_URL;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'ws://' + s;
    try {
      const u = new URL(s);
      return u.protocol === 'ws:' || u.protocol === 'wss:' ? u : null;
    } catch { return null; }
  }

  function join() {
    const u = normalizeWsUrl(wsInput.value);
    if (!u) { wsErr.hidden = false; wsInput.focus(); return; }
    wsErr.hidden = true;
    wsUrlBase = u.toString();
    wsInput.value = wsUrlBase; // 回填规范化后的地址

    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    myName = name;

    // 头部指示条显示实际连接的端点
    document.querySelectorAll('.js-url').forEach((el) => (el.textContent = wsUrlBase));
    joinView.hidden = true;
    chatView.hidden = false;
    input.focus();
    connect();
  }

  joinBtn.addEventListener('click', join);
  sendBtn.addEventListener('click', send);
  // 关键:中文输入法组词时按 Enter 是"上屏"而不是"发送",用 isComposing 区分
  wsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) join(); });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) join(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) send(); });
})();
</script>
</body>
</html>
